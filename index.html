}

 localDirtyBeforeCloud=false;try{localStorage.removeItem(KEY+'_dirty')}catch(e){}
 const next={season:9,year:2026,admin:!!cloudUser,teams:[],players:[],matches:[],archives:[],manualStandings:{},activeMatch:null};
 docs.forEach(d=>{const v=d.data()||{},x=v.data;if(v.kind==='settings'&&x){next.season=x.season??9;next.year=x.year??2026;next.archives=x.archives||[];next.mslLogo=x.mslLogo||null;next.activeMatch=x.activeMatch||null;}else if(v.kind==='standings')next.manualStandings=x||{};else if(v.kind==='team')next.teams.push(x);else if(v.kind==='player')next.players.push(x);else if(v.kind==='match')next.matches.push(x)});

pt="image/*" onchange="uploadImage(event,'organizer')"></div>${btn('Remove organizer photo',"removeImage('organizer')",'danger')}</div></div><p class="upload-help">Tip: Player photos appear in the player directory. Organizer photos appear separately on the MSL home page.</p></div><div class="grid stats">${stat('TEAMS',db.teams.length,'♜')}${stat('PLAYERS',db.players.length,'♟')}${stat('MATCHES',db.matches.length,'▣')}${stat('LIVE MATCHES',db.matches.filter(m=>m.status==='Live').length,'●')}</div><div class="grid cards-grid"><div class="card"><h3>♜ Teams</h3><p class="muted">Create and update clubs, captains and colors.</p>${btn('Add team','teamForm()','primary')} ${btn('View teams',"go('teams')")}</div><div class="card"><h3>♟ Players</h3><p class="muted">Register players and assign their teams.</p>${btn('Add player','playerForm()','primary')} ${btn('Bulk upload photos','bulkPlayerUpload()')} ${btn('View players',"go('players')")}</div><div class="card"><h3>▣ Matches</h3><p class="muted">Schedule fixtures and manage match status.</p>${btn('Create match','matchForm()','primary')} ${btn('▶ Start a match','quickStartMatch()')} ${btn('View matches',"go('matches')")}</div><div class="card"><h3>🏏 Live scoring</h3><p class="muted">Operate the scorer console for a match.</p>${btn('Open scorer','chooseScoringMatch()','primary')}</div><div class="card"><h3>◷ Seasons</h3><p class="muted">Create and preserve separate seasons.</p>${btn('Create season','seasonForm()','primary')} ${btn('Season archive',"go('seasons')")}</div><div class="card"><h3>⇧ Data backup</h3><p class="muted">Export or restore your MSL data.</p>${btn('Export JSON','exportData()','primary')} <label class="btn" style="display:inline-block">Import JSON<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div></div><div class="section-title"><h2>Recent fixtures</h2></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Match</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.matches.map(m=>`<tr><td>${esc(team(m.teamA).name)} vs ${esc(team(m.teamB).name)}</td><td>${fmtDate(m.date)}</td><td>${m.status}</td><td>${btn(m.status==='Upcoming'?'Start scoring':'Open match',m.status==='Upcoming'?`startMatch('${m.id}')`:`openMatch('${m.id}')`)} ${btn('Edit',`editMatch('${m.id}')`)} ${btn('Delete',`deleteMatch('${m.id}')`,'danger')}</td></tr>`).join('')}</tbody></table></div></div>`}
function refreshUploadPreviews(){let t=team(document.getElementById('uploadTeam')?.value),p=player(document.getElementById('uploadPlayer')?.value),o=team(document.getElementById('uploadOrganizer')?.value);[['teamLogoPreview','teamLogoEmpty',t.logo],['playerPhotoPreview','playerPhotoEmpty',p.photo],['organizerPhotoPreview','organizerPhotoEmpty',o.organizerPhoto]].forEach(([a,b,src])=>{let im=document.getElementById(a),empty=document.getElementById(b);if(im){im.src=src||'';im.style.display=src?'':'none'}if(empty)empty.style.display=src?'none':''})}
function imageTarget(type,id){return type==='msl'?db:(type==='team'||type==='organizer')?team(id||(type==='organizer'?document.getElementById('uploadOrganizer')?.value:document.getElementById('uploadTeam')?.value)):player(id||document.getElementById('uploadPlayer')?.value)}
function uploadImage(e,type,id=''){if(!requireAdmin())return;let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Please choose an image file.');e.target.value='';return}if(file.size>8*1024*1024){alert('Please choose an image smaller than 8 MB.');e.target.value='';return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=500,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.55),target=imageTarget(type,id);if(data.length>700000){alert('This image is still too large for the free database limit. Please crop it or choose a smaller image.');return}if(!target){alert('Select a team or player first.');return}let prop=type==='msl'?'mslLogo':type==='team'?'logo':type==='organizer'?'organizerPhoto':'photo';target[prop]=data;try{save();render()}catch(err){alert('This image could not be saved. Try a smaller image or remove older photos.');target[prop]=null;save();render()}};img.onerror=()=>alert('Could not read this image.');img.src=reader.result};reader.readAsDataURL(file)}
function removeImage(type,id=''){if(!requireAdmin())return;let target=imageTarget(type,id);if(!target)return;let prop=type==='msl'?'mslLogo':type==='team'?'logo':type==='organizer'?'organizerPhoto':'photo';if(!target[prop])return;delete target[prop];save();render()}
function toggleAdmin(){if(db.admin){go('home');return}go('admin')}
async function login(e){if(e)e.preventDefault();if(!auth){alert('The sign-in service is not available right now. Reconnect to the internet and reload the app.');return}const email=document.getElementById('loginEmail')?.value.trim(),password=document.getElementById('loginPass')?.value;if(!email||!password)return;try{await auth.signInWithEmailAndPassword(email,password)}catch(err){alert(err.code==='auth/invalid-credential'?'Incorrect email or password.':(err.message||'Sign-in failed.'))}}
async function logout(){if(!auth){db.admin=false;render();return}try{await auth.signOut()}catch(err){alert('Could not sign out: '+err.message)}}
function requireAdmin(){if(!db.admin||!cloudUser){alert('Please sign in with the authorized MSL administrator account first.');return false}return true}
function updateModalViewport(){const h=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--msl-vh',h+'px')}
window.addEventListener('resize',updateModalViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',updateModalViewport);
function openModal(title,body){updateModalViewport();document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBody').scrollTop=0;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function teamForm(id=''){if(!requireAdmin())return;let t=db.teams.find(x=>x.id===id)||{name:'',captain:'',short:'',color:'#f5b82e'};openModal(id?'Edit team':'Add team',`<form onsubmit="saveTeam(event,'${id}')"><div class="field"><label>Team name</label><input name="name" required value="${esc(t.name)}"></div><div class="form-grid"><div class="field"><label>Captain</label><input name="captain" required value="${esc(t.captain)}"></div><div class="field"><label>Short name (2–3 letters)</label><input name="short" maxlength="3" required value="${esc(t.short)}"></div></div><div class="field"><label>Team color</label><input name="color" type="color" value="${t.color}"></div><button class="btn primary">Save team</button></form>`)}
function saveTeam(e,id){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(id)Object.assign(team(id),v);else db.teams.push({id:'t'+Date.now(),...v});save();closeModal();render()}
function playerForm(id=''){if(!requireAdmin())return;let p=db.players.find(x=>x.id===id)||{name:'',teamId:db.teams[0]?.id||'',role:'All-rounder',bat:'Right-hand',bowl:'—',playerType:'Local'};openModal(id?'Edit player':'Register player',`<form onsubmit="savePlayer(event,'${id}')"><div class="field"><label>Player name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Player photo</label><div class="upload-row"><img id="playerFormPhotoPreview" class="upload-preview" src="${p.photo||''}" style="${p.photo?'':'display:none'};width:82px;height:82px;border-radius:50%;object-fit:cover"><span id="playerFormPhotoEmpty" class="muted" style="${p.photo?'display:none':''}">No photo selected</span></div><input id="playerFormPhoto" type="file" accept="image/*" onchange="previewPlayerPhoto(event)">${p.photo?'<label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" name="removePhoto" value="yes" style="width:auto"> Remove current photo</label>':''}<span class="upload-help">Choose a new photo to add or replace the current one.</span></div><div class="field"><label>Team</label><select name="teamId">${db.teams.map(t=>`<option value="${t.id}" ${p.teamId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Player category</label><select name="playerType"><option value="Local" ${p.playerType!=='Open'?'selected':''}>Local player</option><option value="Open" ${p.playerType==='Open'?'selected':''}>Open player (✈)</option></select></div><div class="field"><label>Playing role</label><select name="role">${['Batsman','Bowler','All-rounder','Wicketkeeper'].map(x=>`<option ${p.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Batting style</label><select name="bat"><option>Right-hand</option><option>Left-hand</option></select></div><div class="field"><label>Bowling style</label><input name="bowl" value="${esc(p.bowl)}"></div></div><button class="btn primary">Save player</button></form>`)}
function previewPlayerPhoto(e){const file=e.target.files?.[0],img=document.getElementById('playerFormPhotoPreview'),empty=document.getElementById('playerFormPhotoEmpty');if(!file)return;if(!file.type.startsWith('image/')){alert('Please choose an image file.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{if(img){img.src=reader.result;img.style.display=''}if(empty)empty.style.display='none'};reader.readAsDataURL(file)}
function compressPlayerPhoto(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')||file.size>8*1024*1024){reject(new Error('Choose an image smaller than 8 MB.'));return}const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read this photo.'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('Could not open this photo.'));image.onload=()=>{const scale=Math.min(1,500/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.55);if(data.length>700000){reject(new Error('Photo is too large for the free database limit. Please crop it or choose a smaller image.'));return}resolve(data)};image.src=reader.result};reader.readAsDataURL(file)})}
async function savePlayer(e,id){e.preventDefault();if(!requireAdmin())return;const form=e.target,v=Object.fromEntries(new FormData(form)),file=document.getElementById('playerFormPhoto')?.files?.[0],removePhoto=!!v.removePhoto;delete v.removePhoto;try{if(file)v.photo=await compressPlayerPhoto(file);else if(removePhoto)v.photo=null;const existing=id?player(id):null;if(existing)Object.assign(existing,v);else db.players.push({id:'p'+Date.now(),...v});save();closeModal();render()}catch(err){alert(err.message||'Could not save player photo. Please try another image.')}}
function organizerPhotoForm(teamId){if(!requireAdmin())return;const t=team(teamId);openModal('Organizer photo · '+esc(t.captain||t.name),`<form onsubmit="saveOrganizerPhoto(event,'${teamId}')"><div class="upload-row" style="margin-bottom:14px"><img id="organizerFormPhotoPreview" class="upload-preview" src="${t.organizerPhoto||''}" style="width:92px;height:92px;border-radius:50%;object-fit:cover;${t.organizerPhoto?'':'display:none'}"><span id="organizerFormPhotoEmpty" class="muted" style="${t.organizerPhoto?'display:none':''}">No organizer photo uploaded</span></div><div class="field"><label>Choose organizer photo</label><input id="organizerFormPhoto" type="file" accept="image/*" onchange="previewOrganizerPhoto(event)"></div>${t.organizerPhoto?'<label style="display:flex;align-items:center;gap:8px;margin:8px 0 14px"><input type="checkbox" name="removePhoto" value="yes" style="width:auto"> Remove current photo</label>':''}<button class="btn primary" type="submit">Save organizer photo</button></form>`)}
function previewOrganizerPhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=document.getElementById('organizerFormPhotoPreview'),empty=document.getElementById('organizerFormPhotoEmpty');im.src=r.result;im.style.display='';if(empty)empty.style.display='none'};r.readAsDataURL(f)}
async function saveOrganizerPhoto(e,id){e.preventDefault();if(!requireAdmin())return;const f=document.getElementById('organizerFormPhoto')?.files?.[0],remove=!!new FormData(e.target).get('removePhoto');try{if(f)team(id).organizerPhoto=await compressPlayerPhoto(f);else if(remove)delete team(id).organizerPhoto;else{alert('Choose a photo or select remove current photo.');return}save();closeModal();render()}catch(err){alert(err.message||'Could not save organizer photo.')}}
function matchForm(){if(!requireAdmin())return;if(db.teams.length<2){alert('Add at least two teams first.');return}openModal('Schedule a match',`<form onsubmit="saveMatch(event)"><div class="form-grid"><div class="field"><label>Team A</label><select name="teamA">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select name="teamB">${db.teams.map((t,i)=>`<option value="${t.id}" ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" required></div><div class="field"><label>Overs per innings</label><input type="number" name="oversLimit" min="1" max="50" value="8"></div></div><div class="field"><label>Venue</label><input name="venue" value="Jhabar Cricket Ground"></div><button class="btn primary">Create fixture</button></form>`)}
function saveMatch(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.teamA===v.teamB){alert('Select two different teams.');return}v.id='m'+Date.now();v.status='Upcoming';v.oversLimit=Number(v.oversLimit);v.innings=[];v.result='';db.matches.push(v);save();closeModal();render()}
function editMatch(id){if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id);if(!m)return;openModal('Edit match',`<form onsubmit="saveMatchEdit(event,'${id}')"><div class="form-grid"><div class="field"><label>Team A</label><select name="teamA">${db.teams.map(t=>`<option value="${t.id}" ${m.teamA===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select name="teamB">${db.teams.map(t=>`<option value="${t.id}" ${m.teamB===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" value="${m.date||''}" required></div><div class="field"><label>Overs per innings</label><input type="number" name="oversLimit" min="1" max="50" value="${m.oversLimit||8}" required></div></div><div class="field"><label>Venue</label><input name="venue" value="${esc(m.venue||'Jhabar Cricket Ground')}"></div><div class="field"><label>Status</label><select name="status">${['Upcoming','Live','Completed','Abandoned'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Result / notes</label><input name="result" value="${esc(m.result||'')}"></div><button class="btn primary">Save match changes</button></form><p class="upload-help">Editing fixture details preserves the recorded innings. Changing teams after scoring may affect scorecard interpretation.</p>`)}
function saveMatchEdit(e,id){e.preventDefault();if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id),v=Object.fromEntries(new FormData(e.target));if(v.teamA===v.teamB){alert('Choose two different teams.');return}if((m.innings||[]).length&& (v.teamA!==m.teamA||v.teamB!==m.teamB)){if(!confirm('This match already has score data. Changing teams may affect the scorecard. Continue?'))return}Object.assign(m,v,{oversLimit:Number(v.oversLimit)});save();closeModal();render()}
function deleteMatch(id){if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id);if(!m)return;if(!confirm(`Delete ${team(m.teamA).name} vs ${team(m.teamB).name}, including its scorecard? This cannot be undone unless you have a backup.`))return;db.matches=db.matches.filter(x=>x.id!==id);if(db.activeMatch===id)db.activeMatch=null;save();render()}
function quickStartMatch(){if(!requireAdmin())return;if(db.teams.length<2){alert('Add at least two teams first.');return}openModal('Start a match · Choose teams',`<form onsubmit="createQuickMatch(event)"><div class="form-grid"><div class="field"><label>Team A</label><select name="teamA">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select name="teamB">${db.teams.map((t,i)=>`<option value="${t.id}" ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Overs per innings</label><input type="number" name="oversLimit" min="1" max="50" value="8"></div></div><div class="field"><label>Venue</label><input name="venue" value="Jhabar Cricket Ground"></div><button class="btn primary">Continue to toss & team selection</button></form>`)}
function createQuickMatch(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.teamA===v.teamB){alert('Choose two different teams.');return}let m={id:'m'+Date.now(),teamA:v.teamA,teamB:v.teamB,date:v.date||new Date().toISOString().slice(0,10),venue:v.venue||'Jhabar Cricket Ground',status:'Upcoming',oversLimit:Number(v.oversLimit)||8,innings:[],result:'',practice:true};db.matches.unshift(m);save();closeModal();startMatch(m.id)}
function bulkPlayerUpload(){if(!requireAdmin())return;openModal('Bulk player photo upload',`<p class="muted">Select multiple player photos. After they load, enter each player's name, team and player type. Photos are resized before saving.</p><div class="field"><label>Select multiple photos</label><input id="bulkPhotos" type="file" accept="image/*" multiple onchange="prepareBulkPlayers(event)"></div><div id="bulkPlayerRows"></div>`)}
function prepareBulkPlayers(e){let files=[...(e.target.files||[])];if(!files.length)return;let host=document.getElementById('bulkPlayerRows');host.innerHTML='<div class="notice">Preparing selected photos…</div>';Promise.all(files.map(file=>new Promise(resolve=>{if(!file.type.startsWith('image/')||file.size>8*1024*1024){resolve(null);return}let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve({name:file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),photo:c.toDataURL('image/jpeg',.78)})};im.onerror=()=>resolve(null);im.src=r.result};r.onerror=()=>resolve(null);r.readAsDataURL(file)}))).then(items=>{let good=items.filter(Boolean);window._mslBulk=good;host.innerHTML=good.map((x,i)=>`<div class="card" style="margin:9px 0"><div class="upload-row"><img class="upload-preview" src="${x.photo}"><div style="flex:1"><div class="field"><label>Player name</label><input id="bulkName${i}" value="${esc(x.name)}" required></div><div class="form-grid"><div class="field"><label>Team</label><select id="bulkTeam${i}">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Player type</label><select id="bulkType${i}"><option>Local</option><option>Open</option></select></div></div></div></div></div>`).join('')+`<button class="btn primary" onclick="saveBulkPlayers()">Save ${good.length} players</button>`;if(!good.length)host.innerHTML='<p class="muted">No valid photos selected. Use image files smaller than 8 MB.</p>'})}
function saveBulkPlayers(){if(!requireAdmin())return;let list=window._mslBulk||[];if(!list.length)return;let made=[];for(let i=0;i<list.length;i++){let name=document.getElementById('bulkName'+i)?.value.trim(),teamId=document.getElementById('bulkTeam'+i)?.value,playerType=document.getElementById('bulkType'+i)?.value;if(!name||!teamId){alert('Enter a name and team for every photo.');return}made.push({id:'p'+Date.now()+'_'+i,name,teamId,playerType,photo:list[i].photo,role:'Player',bat:'Right-hand',bowl:'—'})}db.players.push(...made);save();window._mslBulk=[];closeModal();render();alert(`${made.length} players added.`)}
function editPointsTable(){if(!requireAdmin())return;let rows=getStandings();openModal('Edit points table',`<p class="muted">Adjust played, wins, losses, no-results, points and NRR. Manual values override calculated standings until reset.</p>${rows.map((r,i)=>`<div class="card" style="margin:8px 0"><strong>${esc(r.team.name)}</strong><div class="form-grid"><div class="field"><label>Played</label><input type="number" id="ptp_${r.team.id}" value="${r.p}"></div><div class="field"><label>Won</label><input type="number" id="ptw_${r.team.id}" value="${r.w}"></div><div class="field"><label>Lost</label><input type="number" id="ptl_${r.team.id}" value="${r.l}"></div><div class="field"><label>No result</label><input type="number" id="ptnr_${r.team.id}" value="0"></div><div class="field"><label>Points</label><input type="number" id="ptpts_${r.team.id}" value="${r.pts}"></div><div class="field"><label>NRR</label><input type="number" step="0.001" id="ptnrr_${r.team.id}" value="${r.nrr}"></div></div></div>`).join('')}<button class="btn primary" onclick="savePointsTable()">Save table</button> <button class="btn" onclick="resetPointsTable()">Reset to match results</button>`)}
function savePointsTable(){if(!requireAdmin())return;db.manualStandings={};db.teams.forEach(t=>{let g=id=>Number(document.getElementById(id+'_'+t.id)?.value||0);db.manualStandings[t.id]={p:g('ptp'),w:g('ptw'),l:g('ptl'),nr:g('ptnr'),pts:g('ptpts'),nrr:g('ptnrr')}});save();closeModal();render()}
function resetPointsTable(){if(!requireAdmin())return;delete db.manualStandings;save();closeModal();render()}
function seasonForm(){if(!requireAdmin())return;openModal('Create new season',`<form onsubmit="saveSeason(event)"><div class="field"><label>Season number</label><input name="season" type="number" min="1" required value="${db.season+1}"></div><div class="field"><label>Year</label><input name="year" type="number" required value="${new Date().getFullYear()}"></div><div class="notice">Creating a new season archives the current season metadata. This prototype does not yet implement full historical database snapshots.</div><button class="btn primary">Create season</button></form>`)}
function saveSeason(e){e.preventDefault();let f=new FormData(e.target),s=Number(f.get('season')),y=Number(f.get('year'));if(s===db.season){alert('Choose a different season number.');return}db.archives.unshift({season:db.season,year:db.year,champion:'To be added'});db.season=s;db.year=y;db.matches=[];db.players=[];db.teams.forEach(t=>t.players=[]);save();closeModal();render()}
function chooseScoringMatch(){if(!requireAdmin())return;let choices=db.matches.filter(m=>m.status!=='Completed');if(!choices.length){alert('Create a match first.');return}openModal('Select match to score',`<div class="grid">${choices.map(m=>`<button class="btn" style="text-align:left" onclick="closeModal();startMatch('${m.id}')">${esc(team(m.teamA).name)} vs ${esc(team(m.teamB).name)} · ${m.status}</button>`).join('')}</div>`)}
function startMatch(id){if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id);if(!m)return;if(!m.innings)m.innings=[];if(m.innings.length){m.status='Live';db.activeMatch=id;save();scorePage(id);return}let playersA=db.players.filter(p=>p.teamId===m.teamA),playersB=db.players.filter(p=>p.teamId===m.teamB);if(playersA.length<2||playersB.length<1){alert('Add at least two players to the batting team and one to the bowling team before starting.');return}openModal('Match setup · Toss & officials',`<form onsubmit="setupMatch(event,'${id}')"><div class="field"><label>Toss winner</label><select name="tossWinner"><option value="${m.teamA}">${esc(team(m.teamA).name)}</option><option value="${m.teamB}">${esc(team(m.teamB).name)}</option></select></div><div class="field"><label>Toss decision</label><select name="decision"><option value="bat">Elected to bat</option><option value="bowl">Elected to bowl</option></select></div><div class="field"><label>First innings batting team</label><select name="batting" id="setupBatting" onchange="refreshSetupPlayers('${id}')"><option value="${m.teamA}">${esc(team(m.teamA).name)}</option><option value="${m.teamB}">${esc(team(m.teamB).name)}</option></select></div><div class="field"><label>Opening striker</label><select name="striker" id="setupStriker" required>${[...playersA,...playersB].map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="field"><label>Opening non-striker</label><select name="nonStriker" id="setupNonStriker" required>${[...playersA,...playersB].map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="field"><label>Opening bowler</label><select name="bowler" id="setupBowler" required>${[...playersA,...playersB].map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Umpire 1</label><input name="umpire1" placeholder="Umpire name"></div><div class="field"><label>Umpire 2</label><input name="umpire2" placeholder="Umpire name"></div></div><div class="field"><label>Scorer</label><input name="scorer" placeholder="Scorer name"></div><button class="btn primary">Confirm toss & start innings</button></form>`)}
function refreshSetupPlayers(id){let m=db.matches.find(x=>x.id===id),bat=document.getElementById('setupBatting')?.value;if(!m||!bat)return;let bowl=bat===m.teamA?m.teamB:m.teamA;let batters=db.players.filter(p=>p.teamId===bat),bowlers=db.players.filter(p=>p.teamId===bowl);['setupStriker','setupNonStriker'].forEach(k=>{let el=document.getElementById(k),old=el.value;el.innerHTML=batters.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(batters.some(p=>p.id===old))el.value=old});let be=document.getElementById('setupBowler'),old=be.value;be.innerHTML=bowlers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(bowlers.some(p=>p.id===old))be.value=old}
function setupMatch(e,id){e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),m=db.matches.find(x=>x.id===id);let batting=v.batting,bowling=batting===m.teamA?m.teamB:m.teamA;let validBat=db.players.filter(p=>p.teamId===batting).map(p=>p.id);let validBowl=db.players.filter(p=>p.teamId===bowling).map(p=>p.id);if(!validBat.includes(v.striker)||!validBat.includes(v.nonStriker)||v.striker===v.nonStriker||!validBowl.includes(v.bowler)){alert('Choose two different batters from the batting team and a bowler from the opposing team.');return}m.tossWinner=v.tossWinner;m.tossDecision=v.decision;m.umpires=[v.umpire1,v.umpire2].filter(Boolean);m.scorer=v.scorer||'';m.innings=[newInnings(batting,bowling,v.striker,v.nonStriker,v.bowler)];m.status='Live';db.activeMatch=id;save();closeModal();scorePage(id)}
function newInnings(bat,bowl,striker,non,bowler){return {batting:bat,bowling:bowl,runs:0,wickets:0,legal:0,balls:[],striker:striker||'',nonStriker:non||'',bowler:bowler||'',batStats:{},bowlStats:{},extras:{wide:0,noBall:0,bye:0,legBye:0,penalty:0},fow:[],dismissals:[],overBowlers:[],pendingBowler:false,undoStack:[],paused:false}}

/* ============ Match header, chase info, animations ============ */
function matchHeaderHTML(m){
  const a=team(m.teamA), b=team(m.teamB);
  const lastInn=m.innings?.[m.innings.length-1];
  const battingId=lastInn?.batting;
  const logoOrShort=(t)=>t.logo?`<img src="${t.logo}" alt="${esc(t.name)} logo">`:t.short;
  const subFor=(t)=>{
    const inn=m.innings||[];
    const own=inn.filter(i=>i.batting===t.id);
    if(!own.length)return 'Yet to bat';
    const i=own[own.length-1];
    return `${i.runs}/${i.wickets} (${Math.floor(i.legal/6)}.${i.legal%6})`;
  };
  return `<div class="msl-match-header">
    <div class="mh-team ${battingId===m.teamA?'batting':''}">
      <div class="mh-badge" style="background:${a.color}">${logoOrShort(a)}</div>
      <div class="mh-name">${esc(a.name)}</div>
      <div class="mh-sub">${esc(subFor(a))}</div>
    </div>
    <div class="mh-vs">VS</div>
    <div class="mh-team ${battingId===m.teamB?'batting':''}">
      <div class="mh-badge" style="background:${b.color}">${logoOrShort(b)}</div>
      <div class="mh-name">${esc(b.name)}</div>
      <div class="mh-sub">${esc(subFor(b))}</div>
    </div>
  </div>`;
}
function chaseInfoHTML(m){
  const inn=m.innings||[];
  if(inn.length<2)return '';
  const first=inn[0], second=inn[1];
  const target=first.runs+1;
  const runsNeeded=Math.max(0, target-second.runs);
  const ballsTotal=m.oversLimit*6;
  const ballsRemaining=Math.max(0, ballsTotal-second.legal);
  const wicketsLeft=Math.max(0,10-second.wickets);
  if(runsNeeded===0){
    return `<div class="chase-bar target">
      <div class="chase-cell"><div class="cc-label">Result</div><div class="cc-value">WON</div></div>
      <div class="chase-cell"><div class="cc-label">Balls left</div><div class="cc-value">${ballsRemaining}</div></div>
      <div class="chase-cell"><div class="cc-label">Wkts in hand</div><div class="cc-value">${wicketsLeft}</div></div>
    </div><p class="chase-note">${esc(team(second.batting).name)} chased down ${target} with ${ballsRemaining} ball${ballsRemaining===1?'':'s'} to spare.</p>`;
  }
  return `<div class="chase-bar">
    <div class="chase-cell"><div class="cc-label">Runs required</div><div class="cc-value">${runsNeeded}</div></div>
    <div class="chase-cell"><div class="cc-label">Balls remaining</div><div class="cc-value">${ballsRemaining}</div></div>
    <div class="chase-cell"><div class="cc-label">Wickets left</div><div class="cc-value">${wicketsLeft}</div></div>
  </div><p class="chase-note">${esc(team(second.batting).name)} need ${runsNeeded} run${runsNeeded===1?'':'s'} from ${ballsRemaining} ball${ballsRemaining===1?'':'s'} · Target ${target}</p>`;
}
function playFx(kind){
  const layer=document.getElementById('mslFxLayer');
  if(!layer)return;
  layer.innerHTML='';
  let cls='',text='',ringCls='';
  if(kind==='four'){cls='four';text='4';}
  else if(kind==='six'){cls='six';text='6';}
  else if(kind==='wicket'){cls='wicket';text='OUT';ringCls='wicket';}
  else if(kind==='win'){cls='win';text='WON';}
  else return;
  const burst=document.createElement('div');
  burst.className='fx-burst';
  const ring1=document.createElement('div');ring1.className='fx-ring '+ringCls;
  const ring2=document.createElement('div');ring2.className='fx-ring r2 '+ringCls;
  const t=document.createElement('div');t.className='fx-text '+cls;t.textContent=text;
  burst.appendChild(ring1);burst.appendChild(ring2);burst.appendChild(t);
  layer.appendChild(burst);
  setTimeout(()=>{if(layer.firstChild===burst)layer.innerHTML='';},1300);
}

/* ============ Extras prompt ============ */
function askExtraRuns(id,type){
  if(!requireAdmin())return;
  const titleMap={wide:'Wide',noBall:'No-ball',bye:'Bye',legBye:'Leg-bye'};
  const isNoBall=type==='noBall', isWide=type==='wide';
  const isBye=type==='bye'||type==='legBye';
  openModal(titleMap[type]+' · how many runs?', `
    <form onsubmit="confirmExtra(event,'${id}','${type}')">
      ${isNoBall?`
        <div class="field"><label>Runs off the bat</label><select name="batRuns">${[0,1,2,3,4,6].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>
        <div class="field"><label>Extra runs run (byes/leg-byes on top of no-ball)</label><select name="extraRuns">${[0,1,2,3,4].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>
        <p class="upload-help">No-ball penalty (1 run) is added automatically. The delivery does not count as a legal ball.</p>`:''}
      ${isWide?`
        <div class="field"><label>Total wide runs (including the penalty)</label><select name="totalRuns">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>
        <p class="upload-help">Wide penalty (1 run) plus any runs run. Not a legal ball, and no bat runs are allowed.</p>`:''}
      ${isBye?`
        <div class="field"><label>Runs completed (${titleMap[type].toLowerCase()})</label><select name="extraRuns">${[1,2,3,4].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>
        <p class="upload-help">Byes and leg-byes are legal deliveries. The bowler is not charged for these runs.</p>`:''}
      <button class="btn primary" type="submit">Record delivery</button>
    </form>`);
}
function confirmExtra(e,id,type){
  e.preventDefault();
  if(!requireAdmin())return;
  const v=Object.fromEntries(new FormData(e.target));
  const [m,i]=getInn(id);
  if((type==='bye'||type==='legBye')&&i.legal>=m.oversLimit*6){alert('Overs limit reached.');return;}
  pushUndo(i);
  const bat=addBat(i,i.striker), bw=addBowl(i,i.bowler);

  if(type==='wide'){
    const total=Number(v.totalRuns)||1;
    i.runs+=total;
    i.extras.wide=(i.extras.wide||0)+total;
    bw.runs+=total;
    bw.wides=(bw.wides||0)+1;
    i.balls.push({label:'Wd'+(total>1?`+${total-1}`:''),runs:total,legal:false,kind:'wide',batter:i.striker,bowler:i.bowler});
    if(total%2===1 && total>1)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];
    save();closeModal();checkAutoWin(id);scorePage(id);return;
  }
  if(type==='noBall'){
    const batRuns=Number(v.batRuns)||0;
    const extraRuns=Number(v.extraRuns)||0;
    const penalty=1;
    const total=penalty+extraRuns+batRuns;
    i.runs+=total;
    i.extras.noBall=(i.extras.noBall||0)+penalty+extraRuns;
    if(batRuns>0){bat.runs+=batRuns;bat.balls+=1;}
    bw.runs+=total;
    bw.noBalls=(bw.noBalls||0)+1;
    i.balls.push({label:'Nb'+(batRuns?`+${batRuns}`:'')+(extraRuns?`+${extraRuns}b`:''),runs:total,legal:false,kind:'noBall',batter:i.striker,bowler:i.bowler});
    if(batRuns%2===1)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];
    else if(batRuns===0&&extraRuns%2===1)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];
    save();closeModal();checkAutoWin(id);scorePage(id);return;
  }
  const runs=Number(v.extraRuns)||0;
  if(runs<1){alert('Select at least 1 run.');return;}
  i.runs+=runs;
  i.extras[type]=(i.extras[type]||0)+runs;
  bat.balls+=1;
  bw.balls+=1;
  i.legal+=1;
  i.balls.push({label:(type==='bye'?'B':'Lb')+(runs>1?String(runs):''),runs,legal:true,kind:type,batter:i.striker,bowler:i.bowler});
  if(runs%2===1)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];
  if(i.legal%6===0){
    [i.striker,i.nonStriker]=[i.nonStriker,i.striker];
    if(i.legal<m.oversLimit*6)i.pendingBowler=true;
  }
  save();closeModal();
  if(i.pendingBowler)chooseNextBowler(id);else{checkAutoWin(id);scorePage(id)}
}

/* ============ Scorecard rendering ============ */
function inningsBannerHTML(m){
  const inn=m.innings||[];
  if(!inn.length)return '';
  const currentIdx=inn.length-1;
  const cards=inn.map((i,idx)=>{
    const t=team(i.batting);
    const isCurrent=idx===currentIdx&&m.status==='Live';
    const over=Math.floor(i.legal/6),ball=i.legal%6;
    return `<div class="ib-card ${isCurrent?'current':''}">
      <div class="ib-label">${isCurrent?'CURRENT INNINGS':'INNINGS '+(idx+1)+(idx<currentIdx?' · COMPLETED':'')}</div>
      <div class="ib-team">${esc(t.name)}</div>
      <div class="ib-score">${i.runs}/${i.wickets}<small>(${over}.${ball} ov)</small></div>
    </div>`;
  }).join('');
  return `<div class="innings-banner">${cards}</div>`;
}
function battingTableHTML(i){
  const rows=Object.entries(i.batStats||{}).map(([pid,s])=>{
    const d=(i.dismissals||[]).find(x=>x.player===pid);
    const status=d?esc(d.kind)+(d.fielder?' · '+esc(player(d.fielder).name):''):'<span style="color:#9af0cb">Not out</span>';
    return `<tr><td>${esc(player(pid).name)}</td><td>${status}</td><td>${s.runs}</td><td>${s.balls}</td><td>${s.fours||0}</td><td>${s.sixes||0}</td><td>${s.dots||0}</td></tr>`;
  }).join('');
  return `<div class="fs-block"><h4>Batting · ${esc(team(i.batting).name)}</h4><div class="table-wrap"><table><thead><tr><th>Batter</th><th>Dismissal</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>Dots</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">No batting data yet.</td></tr>'}</tbody></table></div></div>`;
}
function bowlingTableHTML(i){
  const rows=Object.entries(i.bowlStats||{}).map(([pid,s])=>{
    const overs=`${Math.floor((s.balls||0)/6)}.${(s.balls||0)%6}`;
    const eco=(s.balls?(s.runs/(s.balls/6)).toFixed(2):'0.00');
    return `<tr><td>${esc(player(pid).name)}</td><td>${overs}</td><td>${s.runs}</td><td>${s.wickets||0}</td><td>${s.foursConceded||0}</td><td>${s.sixesConceded||0}</td><td>${s.wides||0}</td><td>${s.noBalls||0}</td><td>${eco}</td></tr>`;
  }).join('');
  return `<div class="fs-block"><h4>Bowling · ${esc(team(i.bowling).name)}</h4><div class="table-wrap"><table><thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>4s</th><th>6s</th><th>Wd</th><th>Nb</th><th>Eco</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="muted">No bowling data yet.</td></tr>'}</tbody></table></div></div>`;
}
function extrasLineHTML(i){
  const e=i.extras||{};
  const total=Object.values(e).reduce((a,b)=>a+Number(b||0),0);
  return `<p class="fs-note">Extras <strong>${total}</strong> (wd ${e.wide||0}, nb ${e.noBall||0}, b ${e.bye||0}, lb ${e.legBye||0})${(i.fow||[]).length?` · FOW: ${i.fow.map(x=>`${x.r}/${x.w} (${esc(player(x.player).name)}, ${x.over})`).join(' · ')}`:''}</p>`;
}
function fullScorecardHTML(m){
  const inn=m.innings||[];
  if(!inn.length)return '';
  return `<div class="full-scorecard">${inn.map(i=>`
    <div class="fs-block">
      <div class="section-title" style="margin-top:0"><h2>${esc(team(i.batting).name)}</h2><span>${i.runs}/${i.wickets} · ${Math.floor(i.legal/6)}.${i.legal%6} overs</span></div>
      ${battingTableHTML(i)}
      ${bowlingTableHTML(i)}
      ${extrasLineHTML(i)}
    </div>`).join('')}</div>`;
}
function predictMOTM(m){
  const all={};
  (m.innings||[]).forEach(i=>{
    Object.entries(i.batStats||{}).forEach(([pid,s])=>{
      if(!all[pid])all[pid]={bat:0,balls:0,fours:0,sixes:0,w:0,ballsBowled:0,runsConceded:0};
      all[pid].bat+=s.runs; all[pid].balls+=s.balls; all[pid].fours+=s.fours||0; all[pid].sixes+=s.sixes||0;
    });
    Object.entries(i.bowlStats||{}).forEach(([pid,s])=>{
      if(!all[pid])all[pid]={bat:0,balls:0,fours:0,sixes:0,w:0,ballsBowled:0,runsConceded:0};
      all[pid].w+=s.wickets||0; all[pid].ballsBowled+=s.balls||0; all[pid].runsConceded+=s.runs||0;
    });
  });
  const scored=Object.entries(all).map(([pid,s])=>{
    const sr=s.balls?((s.bat/s.balls)*100):0;
    const eco=s.ballsBowled?(s.runsConceded/(s.ballsBowled/6)):0;
    const batScore=s.bat*1 + s.fours*1 + s.sixes*2 + Math.min(sr,200)*0.15;
    const bowlScore=s.w*20 + (s.ballsBowled?Math.max(0,(8-eco))*3:0);
    const total=batScore+bowlScore;
    return {pid,...s,total,sr,eco};
  }).sort((a,b)=>b.total-a.total);
  if(!scored.length)return null;
  const best=scored[0];
  const reason=[];
  if(best.bat>0)reason.push(`${best.bat} runs off ${best.balls} balls (${best.fours}×4, ${best.sixes}×6)`);
  if(best.w>0)reason.push(`${best.w} wicket${best.w===1?'':'s'} for ${best.runsConceded} runs`);
  return {player:player(best.pid),stats:best,reason:reason.join(' · ')||'Top all-round contribution'};
}

/* ============ Auto-win + innings break ============ */
function checkAutoWin(id){
  const m=db.matches.find(x=>x.id===id);
  if(!m||(m.innings||[]).length<2)return false;
  if(m.status==='Completed')return true;
  const [first,second]=m.innings;
  if(second.runs>first.runs){
    const winner=second.batting;
    m.winner=winner;
    m.result=`${team(winner).name} won by ${10-second.wickets} wicket${10-second.wickets===1?'':'s'}`;
    m.status='Completed';
    const motm=predictMOTM(m);
    m.motm=motm?{playerId:motm.player.id,name:motm.player.name,reason:motm.reason}:null;
    save();
    playFx('win');
    return true;
  }
  return false;
}

function scorePage(id){activeScoreMatchId=id;page='score';persistRoute();render()}
function getInn(id){let m=db.matches.find(x=>x.id===id);return [m,m.innings[m.innings.length-1]]}
function snapshot(inn){return JSON.parse(JSON.stringify(inn))}
function pushUndo(i){i.undoStack=i.undoStack||[];let c=snapshot(i);delete c.undoStack;i.undoStack.push(c);if(i.undoStack.length>100)i.undoStack.shift()}
function addBat(inn,id){if(!inn.batStats[id])inn.batStats[id]={runs:0,balls:0,fours:0,sixes:0,dots:0};return inn.batStats[id]}
function addBowl(inn,id){if(!inn.bowlStats[id])inn.bowlStats[id]={runs:0,balls:0,wickets:0,wides:0,noBalls:0,foursConceded:0,sixesConceded:0};return inn.bowlStats[id]}

function recordBall(id,r){
  if(!requireAdmin())return;
  let [m,i]=getInn(id);
  if(i.legal>=m.oversLimit*6){alert('Overs limit reached.');return}
  pushUndo(i);
  let b=addBat(i,i.striker),bw=addBowl(i,i.bowler);
  i.runs+=r;b.runs+=r;b.balls++;
  if(r===0)b.dots=(b.dots||0)+1;
  if(r===4)b.fours++;
  if(r===6)b.sixes++;
  bw.runs+=r;bw.balls++;i.legal++;
  if(r===4)bw.foursConceded=(bw.foursConceded||0)+1;
  if(r===6)bw.sixesConceded=(bw.sixesConceded||0)+1;
  i.balls.push({label:String(r),runs:r,legal:true,kind:'run',batter:i.striker,bowler:i.bowler});
  if(r%2)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];
  if(i.legal%6===0){
    [i.striker,i.nonStriker]=[i.nonStriker,i.striker];
    if(i.legal<m.oversLimit*6)i.pendingBowler=true
  }
  save();
  if(r===4)playFx('four');else if(r===6)playFx('six');
  if(checkAutoWin(id)){scorePage(id);return}
  if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)
}
function recordExtra(id,type){askExtraRuns(id,type)}
function recordWicket(id,kind){if(!requireAdmin())return;let [m,i]=getInn(id);if(i.legal>=m.oversLimit*6){alert('Overs limit reached.');return}pushUndo(i);let out=i.striker;let remaining=db.players.filter(p=>p.teamId===i.batting&&! [i.striker,i.nonStriker].includes(p.id)&&!i.dismissals.some(d=>d.player===p.id));let fielders=db.players.filter(p=>p.teamId===i.bowling);openModal('Wicket details',`<form onsubmit="confirmWicket(event,'${id}','${kind}','${out}')"><p><strong>${esc(player(out).name)}</strong> · ${esc(kind)}</p><div class="field"><label>Dismissed batter</label><select name="dismissed"><option value="${i.striker}">Striker: ${esc(player(i.striker).name)}</option><option value="${i.nonStriker}">Non-striker: ${esc(player(i.nonStriker).name)}</option></select></div>${kind==='Caught'?`<div class="field"><label>Caught by</label><select name="fielder">${fielders.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`:''}${kind==='Run out'?`<div class="field"><label>Run out by (fielder)</label><select name="fielder">${fielders.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Which end / batter dismissed?</label><select name="dismissed"><option value="${i.striker}">${esc(player(i.striker).name)} (striker)</option><option value="${i.nonStriker}">${esc(player(i.nonStriker).name)} (non-striker)</option></select></div><div class="field"><label>Completed runs before run out</label><select name="completedRuns"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>`:''}<div class="field"><label>Next batter</label><select name="nextBatter"><option value="">Select after wicket</option>${remaining.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary">Confirm wicket</button></form>`)}
function confirmWicket(e,id,kind,out){
  e.preventDefault();
  let [m,i]=getInn(id),v=Object.fromEntries(new FormData(e.target)),dismissed=v.dismissed||out;
  pushUndo(i);
  let completed=Number(v.completedRuns||0);
  i.runs+=completed;
  i.wickets++;
  i.legal++;
  let bw=addBowl(i,i.bowler);
  bw.balls++;
  if(!['Run out'].includes(kind))bw.wickets++;
  i.fow.push({w:i.wickets,r:i.runs,over:`${Math.floor((i.legal-1)/6)}.${(i.legal-1)%6}`,player:dismissed});
  i.dismissals.push({player:dismissed,kind,fielder:v.fielder||'',bowler:i.bowler,over:i.legal});
  m.fielding=m.fielding||{};
  if(v.fielder){m.fielding[v.fielder]=m.fielding[v.fielder]||{catches:0,runOuts:0};if(kind==='Caught')m.fielding[v.fielder].catches++;if(kind==='Run out')m.fielding[v.fielder].runOuts++;}
  i.balls.push({label:'W',runs:completed,legal:true,kind:'wicket',dismissal:kind,player:dismissed,fielder:v.fielder||'',bowler:i.bowler});
  let next=v.nextBatter;
  const end=dismissed===i.striker?'striker':'nonStriker';
  i[end]=next||'';
  i.pendingWicketEnd=end;
  if(i.legal%6===0){[i.striker,i.nonStriker]=[i.nonStriker,i.striker];if(i.legal<m.oversLimit*6)i.pendingBowler=true}
  save();
  closeModal();
  // Play wicket animation immediately — before next batter selection
  playFx('wicket');
  if(checkAutoWin(id)){scorePage(id);return}
  if(i.wickets>=10||i.legal>=m.oversLimit*6){scorePage(id);return}
  if(!next){
    openModal('Select next batter',`<p>Choose the incoming batter to continue.</p><div class="field"><select id="nextBatter">${db.players.filter(p=>p.teamId===i.batting&&!i.dismissals.some(d=>d.player===p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="setNextBatter('${id}','${dismissed}')">Continue</button>`);
    return;
  }
  if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)
}
function setNextBatter(id,dismissed){let [m,i]=getInn(id),v=document.getElementById('nextBatter').value;if(!v)return;i[i.pendingWicketEnd||'striker']=v;delete i.pendingWicketEnd;closeModal();save();if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)}
function chooseNextBowler(id){let [m,i]=getInn(id);let eligible=db.players.filter(p=>p.teamId===i.bowling&&p.id!==i.bowler);openModal('Over complete · Select next bowler',`<p>Six legal balls completed. Select the bowler for over ${Math.floor(i.legal/6)+1}.</p><div class="field"><label>Next over bowler</label><select id="nextBowler">${eligible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="setNextBowler('${id}')">Start next over</button>`)}
function setNextBowler(id){let [m,i]=getInn(id),v=document.getElementById('nextBowler').value;if(!v){alert('Select a bowler.');return}i.bowler=v;i.pendingBowler=false;i.overBowlers.push(v);closeModal();save();scorePage(id)}
function confirmNextBatter(id){let [m,i]=getInn(id);i.striker=document.getElementById('nextBatter').value;closeModal();save();scorePage(id)}
function changePlayer(id,which){
  let [m,i]=getInn(id);
  if(which==='bowler'&&i.legal%6!==0){alert('Cannot change bowler mid-over. Complete 6 balls first.');return}
  let v=document.getElementById(which==='striker'?'newStriker':'newBowler').value;
  if(which==='striker')i.striker=v;else i.bowler=v;
  save();scorePage(id)
}
function undoBall(id){if(!requireAdmin())return;let [m,i]=getInn(id);if(!i.balls.length||!i.undoStack?.length){alert('Nothing to undo.');return}let history=i.undoStack;let prev=history.pop();Object.keys(i).forEach(k=>delete i[k]);Object.assign(i,prev);i.undoStack=history;save();scorePage(id)}
function pauseScoring(id){if(!requireAdmin())return;let [m,i]=getInn(id);i.paused=true;save();scorePage(id)}
function resumeScoring(id){
  if(!requireAdmin())return;
  let [m,i]=getInn(id);
  i.paused=false;
  save();
  // After resume, ask what's next if we're at an innings break or over break
  if(m.innings.length===1&&i.ended){renderInningsBreak();scorePage(id);return}
  if(i.legal%6===0&&i.legal>0&&i.legal<m.oversLimit*6){chooseNextBowler(id);return}
  scorePage(id);
}
function endInnings(id){
  let [m,i]=getInn(id);
  if(!requireAdmin())return;
  if(m.innings.length>=2){alert('Both innings have been recorded. Complete the match.');return}
  i.ended=true;
  i.paused=false;
  save();
  // Do NOT auto-open the modal — the innings-break overlay handles that.
  renderInningsBreak();
  scorePage(id);
}
  // Optionally prep the second-innings form right away when admin proceeds
  let batting=i.bowling,bowling=i.batting;
  let eligible=db.players.filter(p=>p.teamId===batting);
  let other=db.players.filter(p=>p.teamId===bowling);
  openModal('Start second innings',`<form onsubmit="secondInnings(event,'${id}','${batting}','${bowling}')"><p class="muted">Innings 1 complete: ${esc(team(i.batting).name)} ${i.runs}/${i.wickets} (${Math.floor(i.legal/6)}.${i.legal%6} ov). Target ${i.runs+1}.</p><div class="field"><label>Opening striker</label><select name="striker">${eligible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Non-striker</label><select name="nonStriker">${eligible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Opening bowler</label><select name="bowler">${other.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary">Start second innings</button></form>`);
}
function secondInnings(e,id,bat,bowl){
  e.preventDefault();
  if(!requireAdmin())return;
  let v=Object.fromEntries(new FormData(e.target)),m=db.matches.find(x=>x.id===id);
  m.innings.push(newInnings(bat,bowl,v.striker,v.nonStriker,v.bowler));
  m.innings[0].ended=true;
  save();closeModal();
  // Hide innings break overlay
  const host=document.getElementById('inningsBreakLayer');if(host)host.innerHTML='';
  scorePage(id);
}
function completeMatch(id){
  let m=db.matches.find(x=>x.id===id);
  if(m.innings.length<2){alert('Complete both innings first.');return}
  let [a,b]=m.innings;
  let winner=a.runs>b.runs?a.batting:b.runs>a.runs?b.batting:null;
  m.winner=winner;
  m.result=winner?`${team(winner).name} won`:'Match tied';
  m.status='Completed';
  const motm=predictMOTM(m);
  m.motm=motm?{playerId:motm.player.id,name:motm.player.name,reason:motm.reason}:null;
  save();
  openModal('Match completed',`<h2>${esc(m.result)}</h2><p>${esc(team(a.batting).name)} ${a.runs}/${a.wickets} · ${esc(team(b.batting).name)} ${b.runs}/${b.wickets}</p>${motm?`<div class="motm-card"><div class="eyebrow">MAN OF THE MATCH PREDICTION</div><h3>🏆 ${esc(motm.player.name)}</h3><div class="motm-stats">${esc(motm.reason)}</div></div>`:''}<button class="btn primary" onclick="closeModal();go('matches')">View matches</button>`);
}
function openMatch(id){
  let m=db.matches.find(x=>x.id===id);
  if(!m)return;
  // Show score page for live matches (public + admin), or full match centre for completed/upcoming
  if(m.status==='Live'){scorePage(id);return}
  let inn=m.innings||[];
  openModal('Match centre',`<div>${esc(team(m.teamA).name)} <strong>vs</strong> ${esc(team(m.teamB).name)}</div><p class="muted">${fmtDate(m.date)} · ${esc(m.venue)} · Umpires: ${esc((m.umpires||[]).join(' / ')||'—')} · Scorer: ${esc(m.scorer||'—')}</p>${inn.map((i,n)=>`<div class="card" style="margin:10px 0"><strong>${esc(team(i.batting).name)}</strong><h2>${i.runs}/${i.wickets} <small class="muted">${Math.floor(i.legal/6)}.${i.legal%6} overs</small></h2><p class="muted">Extras: ${Object.values(i.extras).reduce((a,b)=>a+b,0)} · ${Math.floor(i.legal/6)}.${i.legal%6} overs</p><div class="table-wrap"><table><thead><tr><th>Batter</th><th>Dismissal</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>Dots</th></tr></thead><tbody>${Object.entries(i.batStats).map(([pid,s])=>{let d=(i.dismissals||[]).find(x=>x.player===pid);return `<tr><td>${esc(player(pid).name)}</td><td>${d?esc(d.kind)+(d.fielder?' · '+esc(player(d.fielder).name):''):'Not out'}</td><td>${s.runs}</td><td>${s.balls}</td><td>${s.fours||0}</td><td>${s.sixes||0}</td><td>${s.dots||0}</td></tr>`}).join('')}</tbody></table></div><h4>Bowling</h4><div class="table-wrap"><table><thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>4s</th><th>6s</th><th>Wd</th><th>Nb</th><th>Eco</th></tr></thead><tbody>${Object.entries(i.bowlStats||{}).map(([pid,s])=>`<tr><td>${esc(player(pid).name)}</td><td>${Math.floor((s.balls||0)/6)}.${(s.balls||0)%6}</td><td>${s.runs}</td><td>${s.wickets||0}</td><td>${s.foursConceded||0}</td><td>${s.sixesConceded||0}</td><td>${s.wides||0}</td><td>${s.noBalls||0}</td><td>${(s.balls?(s.runs/(s.balls/6)).toFixed(2):'0.00')}</td></tr>`).join('')}</tbody></table></div><p class="muted">Fall of wickets: ${(i.fow||[]).map(x=>`${x.r}/${x.w} (${esc(player(x.player).name)}, ${x.over})`).join(' · ')||'—'}</p></div>`).join('')||'<p class="muted">Match has not started yet.</p>'}<p><strong>${esc(m.result||m.status)}</strong></p>${m.motm?`<div class="motm-card"><div class="eyebrow">MAN OF THE MATCH PREDICTION</div><h3>🏆 ${esc(m.motm.name)}</h3><div class="motm-stats">${esc(m.motm.reason)}</div></div>`:''}`)
}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='msl-backup-season-'+db.season+'.json';a.click();URL.revokeObjectURL(url)}
function importData(e){if(!requireAdmin())return;let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||!Array.isArray(v.teams)||!Array.isArray(v.matches)||!Array.isArray(v.players))throw Error('Missing teams, matches or players arrays.');if(v.teams.some(x=>!x||!x.id||!x.name)||v.players.some(x=>!x||!x.id||!x.name||!x.teamId)||v.matches.some(x=>!x||!x.id||!x.teamA||!x.teamB))throw Error('One or more records are missing required fields.');if(!confirm(`Backup preview\n\nSeason: ${v.season??'Not specified'}\nTeams: ${v.teams.length}\nPlayers: ${v.players.length}\nMatches: ${v.matches.length}\n\nThis will replace the current MSL data on all connected devices. Your current data will be downloaded as a backup first. Continue?`))return;exportData();db={...structuredClone(seed),...v,admin:true,teams:v.teams,players:v.players,matches:v.matches,archives:Array.isArray(v.archives)?v.archives:[],manualStandings:v.manualStandings||{}};save();render();alert('Backup imported. Keep the downloaded safety backup until you verify the website data.')}catch(err){alert('Import stopped: '+(err.message||'Invalid MSL backup file.'))}finally{e.target.value=''}};r.readAsText(file)}
render();
</script>
