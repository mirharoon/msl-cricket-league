<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const KEY='msl_league_v1';
const firebaseConfig={apiKey:"AIzaSyBxcMJgbuu__w_EZcVxTH7IbyclIlO3UW8",authDomain:"msl-cricket-league.firebaseapp.com",projectId:"msl-cricket-league",storageBucket:"msl-cricket-league.firebasestorage.app",messagingSenderId:"907435432625",appId:"1:907435432625:web:24a1f484af333e3fcee090"};
let auth=null, firestore=null;
try{if(window.firebase){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();firestore=firebase.firestore();}}catch(firebaseInitError){console.warn('Firebase unavailable; MSL will use this device until the connection returns.',firebaseInitError)}
let cloudUser=null, cloudReady=false, applyingCloud=false, initialServerSnapshot=false, saveQueue=Promise.resolve(), localDirtyBeforeCloud=localStorage.getItem(KEY+'_dirty')==='1';
try{if(firestore)firestore.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
const seed={
 season:9,year:2026,admin:false,
 teams:[
  {id:'t1',name:'Thamewali Kings',captain:'Muzamil',color:'#f4bd3e',short:'TK',players:[]},
  {id:'t2',name:'Mariwala Eleven',captain:'Shafiq',color:'#55a7e8',short:'ME',players:[]},
  {id:'t3',name:'Tabasum Thunder',captain:'Haroon',color:'#ed6b68',short:'TT',players:[]},
  {id:'t4',name:'Sea Warriors',captain:'Arshad',color:'#52c6a1',short:'SW',players:[]},
  {id:'t5',name:'Malik Club',captain:'Aslam',color:'#ad8ae8',short:'MC',players:[]},
  {id:'t6',name:'Black Gang',captain:'Moavia',color:'#a8b5c7',short:'BG',players:[]}
 ],
 players:[
  {id:'p1',name:'Muzamil',teamId:'t1',role:'All-rounder',bat:'Right-hand',bowl:'Right-arm medium'},
  {id:'p2',name:'Shafiq',teamId:'t2',role:'Batsman',bat:'Right-hand',bowl:'—'},
  {id:'p3',name:'Haroon',teamId:'t3',role:'All-rounder',bat:'Right-hand',bowl:'Right-arm medium'},
  {id:'p4',name:'Arshad',teamId:'t4',role:'Bowler',bat:'Right-hand',bowl:'Right-arm fast'},
  {id:'p5',name:'Aslam',teamId:'t5',role:'Batsman',bat:'Right-hand',bowl:'—'},
  {id:'p6',name:'Moavia',teamId:'t6',role:'All-rounder',bat:'Right-hand',bowl:'Right-arm spin'}
 ],
 matches:[
  {id:'m1',teamA:'t1',teamB:'t2',date:'2026-11-15',venue:'Jhabar Cricket Ground',status:'Upcoming',oversLimit:8,innings:[],result:''},
  {id:'m2',teamA:'t3',teamB:'t4',date:'2026-11-16',venue:'Jhabar Cricket Ground',status:'Upcoming',oversLimit:8,innings:[],result:''},
  {id:'m3',teamA:'t5',teamB:'t6',date:'2026-11-17',venue:'Jhabar Cricket Ground',status:'Upcoming',oversLimit:8,innings:[],result:''}
 ],
 activeMatch:null,archives:[{season:8,year:2025,champion:'To be added'},{season:7,year:2024,champion:'To be added'}]
};
let db=load(); db.admin=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function status(text){let el=document.getElementById('storageStatus');if(el)el.textContent=text}
function hasLeagueData(x){return !!(x&&(x.teams?.length||x.players?.length||x.matches?.length))}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db));status('● Saved on this device · syncing…')}catch(e){status('● Device storage full · cloud sync pending')}
 if(!cloudReady||!firestore){localDirtyBeforeCloud=true;try{localStorage.setItem(KEY+'_dirty','1')}catch(e){}return;}
 if(!cloudUser||applyingCloud)return;
 const snapshot=JSON.parse(JSON.stringify(db));
 saveQueue=saveQueue.then(async()=>{
  const col=firestore.collection('mslData'), batch=firestore.batch();
  const docs=[{id:'settings',kind:'settings',data:{season:snapshot.season,year:snapshot.year,archives:snapshot.archives||[],mslLogo:snapshot.mslLogo||null,activeMatch:snapshot.activeMatch||null}},{id:'standings',kind:'standings',data:snapshot.manualStandings||{}}];
  (snapshot.teams||[]).forEach(x=>docs.push({id:'team_'+x.id,kind:'team',data:x}));
  (snapshot.players||[]).forEach(x=>docs.push({id:'player_'+x.id,kind:'player',data:x}));
  (snapshot.matches||[]).forEach(x=>docs.push({id:'match_'+x.id,kind:'match',data:x}));
  if(docs.length>450)throw new Error('This league has too many records for one safe sync batch.');
  const existing=await col.get(); const keep=new Set(docs.map(x=>x.id));
  existing.forEach(d=>{if(!keep.has(d.id))batch.delete(d.ref)});
  docs.forEach(x=>batch.set(col.doc(x.id),{kind:x.kind,data:x.data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}));
  await batch.commit();localDirtyBeforeCloud=false;try{localStorage.removeItem(KEY+'_dirty')}catch(e){}status('● Synced with MSL cloud');
 }).catch(err=>{console.error('MSL cloud sync:',err);status('● Sync pending · '+(err.code||'connection issue'))});
}
function applyCloudDocs(snapshot){
 const docs=snapshot.docs; if(!docs.length){if(!initialServerSnapshot)return; if(hasLeagueData(db)){save();return;} db=structuredClone(seed);save();render();return;}
 if(localDirtyBeforeCloud&&cloudUser&&confirm('This device has changes saved while offline. Replace the shared cloud data with this device copy? Choose Cancel to keep the shared cloud data and discard the unsynced local changes.')){cloudReady=true;save();return;}
 localDirtyBeforeCloud=false;try{localStorage.removeItem(KEY+'_dirty')}catch(e){}
 const next={season:9,year:2026,admin:!!cloudUser,teams:[],players:[],matches:[],archives:[],manualStandings:{},activeMatch:null};
 docs.forEach(d=>{const v=d.data()||{},x=v.data;if(v.kind==='settings'&&x){next.season=x.season??9;next.year=x.year??2026;next.archives=x.archives||[];next.mslLogo=x.mslLogo||null;next.activeMatch=x.activeMatch||null;}else if(v.kind==='standings')next.manualStandings=x||{};else if(v.kind==='team')next.teams.push(x);else if(v.kind==='player')next.players.push(x);else if(v.kind==='match')next.matches.push(x)});
 if(!next.teams.length&&!next.players.length&&!next.matches.length){if(hasLeagueData(db)){save();return;}Object.assign(next,structuredClone(seed));}
 applyingCloud=true;db=next;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}applyingCloud=false;render();status(snapshot.metadata.fromCache?'● Offline copy · reconnecting':'● Live cloud data');
}
if(firestore){firestore.collection('mslData').onSnapshot({includeMetadataChanges:true},snap=>{if(snap.metadata.fromCache&&!initialServerSnapshot){status('● Loading saved league data…');return;}initialServerSnapshot=true;cloudReady=true;applyCloudDocs(snap)},err=>{console.error(err);status('● Cloud unavailable · using device copy')});}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('Offline app shell unavailable',err)));
if(auth){auth.onAuthStateChanged(user=>{cloudUser=user;db.admin=!!(user&&user.email&&user.email.toLowerCase()==='mirharoonofficial@gmail.com');render();if(user)status('● Admin signed in · cloud connected');else status('● Public view · cloud connected')});}else{status('● Local mode · cloud connection unavailable');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function team(id){return db.teams.find(t=>t.id===id)||{name:'Unknown',short:'??',color:'#778899',captain:'—'}}
function player(id){return db.players.find(p=>p.id===id)||{name:'—'}}
function initials(s){return (s||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function fmtDate(d){if(!d)return 'Date TBC';return new Date(d+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})}
let page='home';
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===p;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render()}
document.addEventListener('click',event=>{const navButton=event.target.closest('[data-page]');if(navButton){event.preventDefault();go(navButton.dataset.page)}});
function head(title,sub,buttons=''){return `<div class="page-head"><div><div class="eyebrow">MARIWALA SUPER LEAGUE / SEASON ${db.season}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`}
function btn(label,fn,cls=''){return `<button type="button" class="btn ${cls}" onclick="${fn}">${label}</button>`}
function render(){const m=document.getElementById('main');try{document.getElementById('seasonPill').textContent=`SEASON ${db.season} • ${db.year}`;const brand=document.getElementById('brandLogo');if(brand)brand.innerHTML=db.mslLogo?`<img src="${db.mslLogo}" alt="MSL logo" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">`:'MSL';const pages={home:homePage,matches:matchesPage,teams:teamsPage,players:playersPage,points:pointsPage,stats:statsPage,seasons:seasonsPage,admin:adminPage,more:morePage};m.innerHTML=(pages[page]||homePage)()}catch(err){console.error('MSL page render failed:',err);m.innerHTML=`<div class="card error-card"><div class="eyebrow">MSL DISPLAY ERROR</div><h2>This section could not be displayed</h2><p class="muted">Your saved league data has not been deleted. Please return to Home or reload the page.</p><button type="button" class="btn primary" onclick="go('home')">Return to Home</button></div>`}}
function stat(label,value,symbol){return `<div class="card stat"><div><div class="label">${label}</div><div class="value">${value}</div></div><div class="symbol">${symbol}</div></div>`}
function matchCard(m){let a=team(m.teamA),b=team(m.teamB),status=m.status;let inn=m.innings||[],score=inn.length?`${inn[inn.length-1].runs}/${inn[inn.length-1].wickets}`:'—';return `<div class="match-card"><div class="match-top"><span>${esc(m.venue||'Jhabar Cricket Ground')}</span><span class="${status==='Live'?'live':''}">${status==='Live'?'● LIVE':status.toUpperCase()}</span></div><div class="teams-line"><div class="team-mini"><div class="team-badge" style="background:${a.color};color:#101a2b">${a.short}</div><strong>${esc(a.name)}</strong><small>${esc(a.captain)}</small></div><div class="versus">VS</div><div class="team-mini"><div class="team-badge" style="background:${b.color};color:#101a2b">${b.short}</div><strong>${esc(b.name)}</strong><small>${esc(b.captain)}</small></div></div><div class="scoreline">${score} <small>${inn.length?`(${inn[inn.length-1].legal}/${m.oversLimit||8} ov)`:'• '+fmtDate(m.date)}</small></div><div style="display:flex;justify-content:center;margin-top:13px">${status==='Live'?btn('Open live score',`openMatch('${m.id}')`,'primary'):status==='Completed'?btn('View scorecard',`openMatch('${m.id}')`):btn('Match details',`openMatch('${m.id}')`)}${db.admin?` <div style="display:flex;justify-content:center;gap:7px;margin-top:8px">${btn('Edit',`editMatch('${m.id}')`)}${btn('Delete',`deleteMatch('${m.id}')`,'danger')}</div>`:''}</div></div>`}
function homePage(){let live=db.matches.filter(m=>m.status==='Live'),up=db.matches.filter(m=>m.status==='Upcoming'),done=db.matches.filter(m=>m.status==='Completed');let organizers=db.teams.map(t=>{let cp=db.players.find(p=>p.teamId===t.id&&(p.isCaptain||p.name.trim().toLowerCase()===String(t.captain||'').trim().toLowerCase()))||db.players.find(p=>p.teamId===t.id&&p.name.trim().toLowerCase()===String(t.captain||'').trim().toLowerCase());return {team:t, name:t.captain||cp?.name||'Team Captain', photo:cp?.photo||''}});return `${head('League overview','Welcome to the home of Mariwala Super League.',db.admin?btn('+ Schedule match','matchForm()','primary'): '')}<div class="grid stats">${stat('TEAMS',db.teams.length,'♜')}${stat('PLAYERS',db.players.length,'♟')}${stat('MATCHES PLAYED',done.length,'▣')}${stat('UPCOMING',up.length,'◷')}</div><div class="card" style="margin-bottom:18px;background:linear-gradient(120deg,#182e49,#102139);border-color:#705b2d"><div class="section-title" style="margin-top:0"><div><div class="eyebrow">THE PEOPLE BEHIND MSL</div><h2 style="font-size:22px;margin-top:4px">MSL Organizers</h2></div><span>${organizers.length} team captains</span></div><p class="muted" style="font-size:13px;margin-top:0">Our team captains are also the organizers who bring the league together.</p><div class="grid cards-grid" style="grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px">${organizers.map((o,i)=>`<div style="text-align:center;padding:15px 9px;border-radius:15px;background:linear-gradient(160deg,#203a58,#12243a);border:1px solid ${o.team.color||'#304660'}66"><div style="width:94px;height:94px;border-radius:50%;padding:3px;margin:0 auto 10px;background:linear-gradient(135deg,${o.team.color||'#f5b82e'},#e7edf5);box-shadow:0 7px 22px #0006"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#09182a;display:grid;place-items:center;font-size:27px;font-weight:900;color:#f5c24b">${o.photo?`<img src="${o.photo}" alt="${esc(o.name)}" style="width:100%;height:100%;object-fit:cover">`:initials(o.name)}</div></div><div style="font-weight:850;font-size:14px">${esc(o.name)}</div><div style="font-size:11px;color:var(--gold);font-weight:800;margin-top:3px">ORGANIZER</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${esc(o.team.name)}</div>${db.admin&&db.players.some(p=>p.teamId===o.team.id&&p.name.trim().toLowerCase()===String(o.name).trim().toLowerCase())?`<div style="margin-top:8px">${btn('Update photo',`go('players');setTimeout(()=>playerForm('${db.players.find(p=>p.teamId===o.team.id&&p.name.trim().toLowerCase()===String(o.name).trim().toLowerCase()).id}'),0)`,'')}</div>`:''}</div>`).join('')}</div></div><div class="grid two"><div><div class="section-title"><h2>${live.length?'Live match':'Featured matches'}</h2><span>${live.length?'FOLLOW THE ACTION':'SEASON '+db.season}</span></div>${live.length?live.map(matchCard).join(''):(up.length?matchCard(up[0]):`<div class="card empty">No scheduled matches yet.</div>`)}<div class="section-title"><h2>Upcoming fixtures</h2><span>${up.length} scheduled</span></div><div class="grid">${up.slice(live.length?0:1,3).map(matchCard).join('')||'<div class="card empty">More fixtures will appear here.</div>'}</div></div><div><div class="section-title"><h2>Teams this season</h2><span>${db.teams.length} teams</span></div><div class="card">${db.teams.map(t=>`<div class="player-card" style="margin:10px 0"><div class="team-badge" style="background:${t.color};color:#101a2b;overflow:hidden">${t.logo?`<img src="${t.logo}" alt="">`:t.short}</div><div style="flex:1"><h3>${esc(t.name)}</h3><p>Captain: ${esc(t.captain)}</p></div><span class="badge">${db.players.filter(p=>p.teamId===t.id).length} players</span></div>`).join('')}</div><div class="section-title"><h2>League information</h2></div><div class="card"><div class="eyebrow">HOME GROUND</div><h3 style="margin:7px 0">Jhabar Cricket Ground</h3><p class="muted" style="font-size:13px;margin:0">Thamewali, Mianwali · Pakistan</p><div style="border-top:1px solid var(--line);margin-top:15px;padding-top:13px;color:var(--muted);font-size:12px">MSL brings local cricket communities together through competition, teamwork and sportsmanship.</div></div></div></div>`}
function matchesPage(){let all=db.matches;return `${head('Matches & scores','Live action, upcoming fixtures and completed results.',db.admin?btn('+ Create fixture','matchForm()')+' '+btn('▶ Start a match','quickStartMatch()','primary'):'' )}<div class="tabs"><button class="active" onclick="filterMatches('All',this)">All matches</button><button onclick="filterMatches('Live',this)">Live</button><button onclick="filterMatches('Upcoming',this)">Upcoming</button><button onclick="filterMatches('Completed',this)">Results</button></div><div id="matchList" class="grid cards-grid">${all.map(matchCard).join('')||'<div class="card empty">No matches scheduled.</div>'}</div>`}

function teamsPage(){return `${head('The teams','Meet the clubs competing in MSL Season '+db.season+'.',db.admin?btn('+ Add team','teamForm()','primary'):'')}<div class="grid cards-grid">${db.teams.map(t=>`<div class="card team-card" style="--team-color:${t.color}"><div class="team-card-head"><div class="team-emblem">${t.logo?`<img src="${t.logo}" alt="${esc(t.name)} logo">`:t.short}</div><div><h3>${esc(t.name)}</h3><p>Captain: ${esc(t.captain)}</p></div></div><div class="team-meta"><span>♟ ${db.players.filter(p=>p.teamId===t.id).length} players</span><span>Season ${db.season}</span></div>${db.admin?`<div style="margin-top:12px">${btn('Edit team',`teamForm('${t.id}')`,'')}</div>`:''}</div>`).join('')}</div>`}
function playersPage(){return `${head('Players','Explore the MSL player directory.',db.admin?btn('+ Add player','playerForm()','primary'):'')}<div class="toolbar"><input id="playerSearch" placeholder="Search player..." oninput="searchPlayers()" style="flex:1;min-width:180px;background:#09182a;border:1px solid #304660;border-radius:10px;padding:10px;color:white"><select id="teamFilter" onchange="searchPlayers()" style="background:#09182a;border:1px solid #304660;border-radius:10px;padding:10px;color:white"><option value="">All teams</option>${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="grid cards-grid" id="playerList">${playerCards(db.players)}</div>`}
function playerCards(list){return list.map(p=>`<div class="card"><div class="player-card"><div class="avatar">${p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`:initials(p.name)}</div><div style="flex:1"><h3>${esc(p.name)}</h3><p>${esc(team(p.teamId).name)} · ${esc(p.role||'Player')}</p></div><span class="badge">${p.playerType==='Open'?'✈ OPEN':'LOCAL'}</span></div><div class="team-meta"><span>${esc(p.bat||'—')}</span><span>${esc(p.bowl||'—')}</span></div>${db.admin?`<div style="margin-top:12px">${btn('Edit',`playerForm('${p.id}')`)}</div>`:''}</div>`).join('')||'<div class="card empty">No players found. Add players from the admin panel.</div>'}
function searchPlayers(){let q=(document.getElementById('playerSearch')?.value||'').toLowerCase(),t=document.getElementById('teamFilter')?.value||'';document.getElementById('playerList').innerHTML=playerCards(db.players.filter(p=>p.name.toLowerCase().includes(q)&&(!t||p.teamId===t)))}
function getStandings(){return db.teams.map(t=>{let ms=db.matches.filter(m=>m.status==='Completed'&&[m.teamA,m.teamB].includes(t.id));let won=ms.filter(m=>m.winner===t.id).length,lost=ms.length-won;let x=db.manualStandings?.[t.id];return x?{team:t,...x}:{team:t,p:ms.length,w:won,l:lost,nr:0,pts:won*2,nrr:0}}).sort((a,b)=>b.pts-a.pts||b.nrr-a.nrr)}
function pointsPage(){let rows=getStandings();return `${head('Points table','Season ${db.season} standings · 2 points for a win.',db.admin?btn('Edit table','editPointsTable()','primary'):'')}<div class="card"><div class="section-title" style="margin-top:0"><h2>MSL Season ${db.season} – ${db.year}</h2><span>UPDATED FROM MATCH RESULTS</span></div><div class="table-wrap"><table><thead><tr><th>Pos</th><th>Team</th><th>Played</th><th>Won</th><th>Lost</th><th>NR</th><th>Points</th><th>NRR</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><div class="team-cell"><span class="tiny-badge" style="background:${r.team.color};color:#111">${r.team.short}</span><strong>${esc(r.team.name)}</strong></div></td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.nr||0}</td><td><strong>${r.pts}</strong></td><td>${Number(r.nrr||0).toFixed(3)}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:11px;margin-bottom:0">NRR will be calculated from completed innings once full match scorecards are recorded.</p></div>`}
function statsPage(){return `${head('Statistics & records','Season leaders and memorable performances.')}<div class="grid stats">${stat('TOP RUN SCORER','—','🏏')}${stat('MOST WICKETS','—','🎯')}${stat('MOST SIXES','—','🚀')}${stat('PLAYER OF THE MATCH','—','🏆')}</div><div class="grid two"><div class="card"><div class="section-title" style="margin-top:0"><h2>Batting leaderboard</h2><span>SEASON ${db.season}</span></div><div class="empty">Player rankings will populate as match scorecards are recorded.</div></div><div class="card"><div class="section-title" style="margin-top:0"><h2>Bowling leaderboard</h2><span>SEASON ${db.season}</span></div><div class="empty">Bowling rankings will populate as match scorecards are recorded.</div></div></div><div class="section-title"><h2>League records</h2></div><div class="grid three"><div class="card"><div class="muted">Highest team total</div><h2>—</h2></div><div class="card"><div class="muted">Highest individual score</div><h2>—</h2></div><div class="card"><div class="muted">Best bowling figures</div><h2>—</h2></div></div>`}
function seasonsPage(){return `${head('Season archive','Explore MSL history.',db.admin?btn('+ Create season','seasonForm()','primary'):'')}<div class="grid cards-grid"><div class="card team-card"><span class="badge live">CURRENT SEASON</span><h2>Season ${db.season} · ${db.year}</h2><p class="muted">Active season · ${db.teams.length} teams</p><div class="team-meta"><span>${db.matches.length} fixtures</span><span>${db.matches.filter(m=>m.status==='Completed').length} completed</span></div></div>${db.archives.map((a,n)=>`<div class="card"><span class="badge">ARCHIVED</span><h2>Season ${a.season} · ${a.year}</h2><p class="muted">Champion: <strong>${esc(a.champion||'To be added')}</strong></p>${db.admin?btn('Edit season winner',`editArchive(${n})`):''}</div>`).join('')}</div>`}

function editArchive(n){if(!requireAdmin())return;let a=db.archives[n];if(!a)return;openModal('Edit previous season',`<form onsubmit="saveArchive(event,${n})"><div class="field"><label>Season</label><input name="season" type="number" min=1 value="${a.season}" required></div><div class="field"><label>Year</label><input name="year" type="number" value="${a.year}" required></div><div class="field"><label>Previous season champion</label><input name="champion" value="${esc(a.champion||'')}" placeholder="Enter winning team" required></div><button class="btn primary">Save season details</button></form>`)}
function saveArchive(e,n){e.preventDefault();if(!requireAdmin())return;let f=Object.fromEntries(new FormData(e.target));Object.assign(db.archives[n],{season:Number(f.season),year:Number(f.year),champion:f.champion.trim()});save();closeModal();render()}


function morePage(){return `${head('Explore MSL','League tables, records, season history and administration.')}<div class="more-grid">
<button class="more-tile" onclick="go('points')"><span class="tile-icon">🏆</span><span>Points table<small>Standings & rankings</small></span></button>
<button class="more-tile" onclick="go('stats')"><span class="tile-icon">📊</span><span>Statistics<small>Records & leaders</small></span></button>

</div><div class="card" style="margin-top:15px"><div class="eyebrow">MSL SEASON ${db.season}</div><h3 style="margin:7px 0">Cricket • Community • Legacy</h3><p class="muted" style="font-size:12px;margin:0">Jhabar Cricket Ground · Thamewali, Mianwali</p></div>`}

function adminPage(){if(!db.admin)return `${head('Admin access','Sign in to manage MSL.')}<div class="card" style="max-width:460px;margin:25px auto"><div class="eyebrow">RESTRICTED AREA</div><h2>Administrator login</h2><p class="muted">Sign in with the authorized MSL administrator email and password.</p><form onsubmit="login(event)"><div class="field"><label>Administrator email</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="Admin email"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required placeholder="Firebase password"></div><button class="btn primary" style="width:100%">Sign in</button></form><p class="muted" style="font-size:11px">Only the authorized administrator account can make changes.</p></div>`;return `${head('Admin control panel','Manage your league, squads, fixtures and match scoring.',btn('Public view','toggleAdmin()'))}<div class="admin-banner"><span id="cloudAdminStatus">✓ Firebase administrator session active. Changes sync to the shared league database.</span></div><div class="card upload-card" style="margin-bottom:16px"><div class="section-title" style="margin-top:0"><h2>📸 Upload photos & logos</h2><span>Admin only</span></div><p class="muted" style="font-size:12px">Images are saved in this browser and included in your JSON backup. Use JPG, PNG or WebP images. For best results, upload images under 2 MB.</p><div class="grid three"><div><h3>MSL league logo</h3><div class="upload-row"><img class="upload-preview" id="mslLogoPreview" src="${db.mslLogo||''}" style="${db.mslLogo?'':'display:none'}"><span class="muted" id="mslLogoEmpty" style="${db.mslLogo?'display:none':''}">No logo uploaded</span></div><div class="field" style="margin-top:10px"><input type="file" accept="image/*" onchange="uploadImage(event,'msl','')"></div>${btn('Remove MSL logo',"removeImage('msl','')",'danger')}</div><div><h3>Team logo</h3><div class="field"><label>Select existing team</label><select id="uploadTeam" onchange="refreshUploadPreviews()">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="upload-row"><img class="upload-preview" id="teamLogoPreview" src="${db.teams[0]?.logo||''}" style="${db.teams[0]?.logo?'':'display:none'}"><span class="muted" id="teamLogoEmpty" style="${db.teams[0]?.logo?'display:none':''}">No logo uploaded</span></div><div class="field" style="margin-top:10px"><input type="file" accept="image/*" onchange="uploadImage(event,'team')"></div>${btn('Remove selected logo',"removeImage('team')",'danger')}</div><div><h3>Player photo</h3><div class="field"><label>Select player</label><select id="uploadPlayer" onchange="refreshUploadPreviews()">${db.players.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="upload-row"><img class="upload-preview" id="playerPhotoPreview" src="${db.players[0]?.photo||''}" style="${db.players[0]?.photo?'':'display:none'}"><span class="muted" id="playerPhotoEmpty" style="${db.players[0]?.photo?'display:none':''}">No photo uploaded</span></div><div class="field" style="margin-top:10px"><input type="file" accept="image/*" onchange="uploadImage(event,'player')"></div>${btn('Remove selected photo',"removeImage('player')",'danger')}</div></div><p class="upload-help">Tip: Upload each player's original photo here. We can create separate stylish MSL player portraits from the photos you share in chat.</p></div><div class="grid stats">${stat('TEAMS',db.teams.length,'♜')}${stat('PLAYERS',db.players.length,'♟')}${stat('MATCHES',db.matches.length,'▣')}${stat('LIVE MATCHES',db.matches.filter(m=>m.status==='Live').length,'●')}</div><div class="grid cards-grid"><div class="card"><h3>♜ Teams</h3><p class="muted">Create and update clubs, captains and colors.</p>${btn('Add team','teamForm()','primary')} ${btn('View teams',"go('teams')")}</div><div class="card"><h3>♟ Players</h3><p class="muted">Register players and assign their teams.</p>${btn('Add player','playerForm()','primary')} ${btn('Bulk upload photos','bulkPlayerUpload()')} ${btn('View players',"go('players')")}</div><div class="card"><h3>▣ Matches</h3><p class="muted">Schedule fixtures and manage match status.</p>${btn('Create match','matchForm()','primary')} ${btn('▶ Start a match','quickStartMatch()')} ${btn('View matches',"go('matches')")}</div><div class="card"><h3>🏏 Live scoring</h3><p class="muted">Operate the scorer console for a match.</p>${btn('Open scorer','chooseScoringMatch()','primary')}</div><div class="card"><h3>◷ Seasons</h3><p class="muted">Create and preserve separate seasons.</p>${btn('Create season','seasonForm()','primary')} ${btn('Season archive',"go('seasons')")}</div><div class="card"><h3>⇧ Data backup</h3><p class="muted">Export or restore your MSL data.</p>${btn('Export JSON','exportData()','primary')} <label class="btn" style="display:inline-block">Import JSON<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div></div><div class="section-title"><h2>Recent fixtures</h2></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Match</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.matches.map(m=>`<tr><td>${esc(team(m.teamA).name)} vs ${esc(team(m.teamB).name)}</td><td>${fmtDate(m.date)}</td><td>${m.status}</td><td>${btn(m.status==='Upcoming'?'Start scoring':'Open match',m.status==='Upcoming'?`startMatch('${m.id}')`:`openMatch('${m.id}')`)} ${btn('Edit',`editMatch('${m.id}')`)} ${btn('Delete',`deleteMatch('${m.id}')`,'danger')}</td></tr>`).join('')}</tbody></table></div></div>`}
function refreshUploadPreviews(){let t=team(document.getElementById('uploadTeam')?.value),p=player(document.getElementById('uploadPlayer')?.value);[['teamLogoPreview','teamLogoEmpty',t.logo],['playerPhotoPreview','playerPhotoEmpty',p.photo]].forEach(([a,b,src])=>{let im=document.getElementById(a),empty=document.getElementById(b);if(im){im.src=src||'';im.style.display=src?'':'none'}if(empty)empty.style.display=src?'none':''})}
function imageTarget(type,id){return type==='msl'?db:type==='team'?team(id||document.getElementById('uploadTeam')?.value):player(id||document.getElementById('uploadPlayer')?.value)}
function uploadImage(e,type,id=''){if(!requireAdmin())return;let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Please choose an image file.');e.target.value='';return}if(file.size>8*1024*1024){alert('Please choose an image smaller than 8 MB.');e.target.value='';return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=500,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.55),target=imageTarget(type,id);if(data.length>700000){alert('This image is still too large for the free database limit. Please crop it or choose a smaller image.');return}if(!target){alert('Select a team or player first.');return}let prop=type==='msl'?'mslLogo':type==='team'?'logo':'photo';target[prop]=data;try{save();render()}catch(err){alert('This image could not be saved. Try a smaller image or remove older photos.');target[prop]=null;save();render()}};img.onerror=()=>alert('Could not read this image.');img.src=reader.result};reader.readAsDataURL(file)}
function removeImage(type,id=''){if(!requireAdmin())return;let target=imageTarget(type,id);if(!target)return;let prop=type==='msl'?'mslLogo':type==='team'?'logo':'photo';if(!target[prop])return;delete target[prop];save();render()}
function toggleAdmin(){if(db.admin){logout();return}go('admin')}
async function login(e){if(e)e.preventDefault();if(!auth){alert('The sign-in service is not available right now. Reconnect to the internet and reload the app.');return}const email=document.getElementById('loginEmail')?.value.trim(),password=document.getElementById('loginPass')?.value;if(!email||!password)return;try{await auth.signInWithEmailAndPassword(email,password)}catch(err){alert(err.code==='auth/invalid-credential'?'Incorrect email or password.':(err.message||'Sign-in failed.'))}}
async function logout(){if(!auth){db.admin=false;render();return}try{await auth.signOut()}catch(err){alert('Could not sign out: '+err.message)}}
function requireAdmin(){if(!db.admin||!cloudUser){alert('Please sign in with the authorized MSL administrator account first.');return false}return true}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function teamForm(id=''){if(!requireAdmin())return;let t=db.teams.find(x=>x.id===id)||{name:'',captain:'',short:'',color:'#f5b82e'};openModal(id?'Edit team':'Add team',`<form onsubmit="saveTeam(event,'${id}')"><div class="field"><label>Team name</label><input name="name" required value="${esc(t.name)}"></div><div class="form-grid"><div class="field"><label>Captain</label><input name="captain" required value="${esc(t.captain)}"></div><div class="field"><label>Short name (2–3 letters)</label><input name="short" maxlength="3" required value="${esc(t.short)}"></div></div><div class="field"><label>Team color</label><input name="color" type="color" value="${t.color}"></div><button class="btn primary">Save team</button></form>`)}
function saveTeam(e,id){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(id)Object.assign(team(id),v);else db.teams.push({id:'t'+Date.now(),...v});save();closeModal();render()}
function playerForm(id=''){if(!requireAdmin())return;let p=db.players.find(x=>x.id===id)||{name:'',teamId:db.teams[0]?.id||'',role:'All-rounder',bat:'Right-hand',bowl:'—',playerType:'Local'};openModal(id?'Edit player':'Register player',`<form onsubmit="savePlayer(event,'${id}')"><div class="field"><label>Player name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Team</label><select name="teamId">${db.teams.map(t=>`<option value="${t.id}" ${p.teamId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Player category</label><select name="playerType"><option value="Local" ${p.playerType!=='Open'?'selected':''}>Local player</option><option value="Open" ${p.playerType==='Open'?'selected':''}>Open player (✈)</option></select></div><div class="field"><label>Playing role</label><select name="role">${['Batsman','Bowler','All-rounder','Wicketkeeper'].map(x=>`<option ${p.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Batting style</label><select name="bat"><option>Right-hand</option><option>Left-hand</option></select></div><div class="field"><label>Bowling style</label><input name="bowl" value="${esc(p.bowl)}"></div></div><button class="btn primary">Save player</button></form>`)}
function savePlayer(e,id){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(id)Object.assign(player(id),v);else db.players.push({id:'p'+Date.now(),...v});save();closeModal();render()}
function matchForm(){if(!requireAdmin())return;if(db.teams.length<2){alert('Add at least two teams first.');return}openModal('Schedule a match',`<form onsubmit="saveMatch(event)"><div class="form-grid"><div class="field"><label>Team A</label><select name="teamA">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select name="teamB">${db.teams.map((t,i)=>`<option value="${t.id}" ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" required></div><div class="field"><label>Overs per innings</label><input type="number" name="oversLimit" min="1" max="50" value="8"></div></div><div class="field"><label>Venue</label><input name="venue" value="Jhabar Cricket Ground"></div><button class="btn primary">Create fixture</button></form>`)}
function saveMatch(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.teamA===v.teamB){alert('Select two different teams.');return}v.id='m'+Date.now();v.status='Upcoming';v.oversLimit=Number(v.oversLimit);v.innings=[];v.result='';db.matches.push(v);save();closeModal();render()}
function editMatch(id){if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id);if(!m)return;openModal('Edit match',`<form onsubmit="saveMatchEdit(event,'${id}')"><div class="form-grid"><div class="field"><label>Team A</label><select name="teamA">${db.teams.map(t=>`<option value="${t.id}" ${m.teamA===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select name="teamB">${db.teams.map(t=>`<option value="${t.id}" ${m.teamB===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" value="${m.date||''}" required></div><div class="field"><label>Overs per innings</label><input type="number" name="oversLimit" min="1" max="50" value="${m.oversLimit||8}" required></div></div><div class="field"><label>Venue</label><input name="venue" value="${esc(m.venue||'Jhabar Cricket Ground')}"></div><div class="field"><label>Status</label><select name="status">${['Upcoming','Live','Completed','Abandoned'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Result / notes</label><input name="result" value="${esc(m.result||'')}"></div><button class="btn primary">Save match changes</button></form><p class="upload-help">Editing fixture details preserves the recorded innings. Changing teams after scoring may affect scorecard interpretation.</p>`)}
function saveMatchEdit(e,id){e.preventDefault();if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id),v=Object.fromEntries(new FormData(e.target));if(v.teamA===v.teamB){alert('Choose two different teams.');return}if((m.innings||[]).length&& (v.teamA!==m.teamA||v.teamB!==m.teamB)){if(!confirm('This match already has score data. Changing teams may affect the scorecard. Continue?'))return}Object.assign(m,v,{oversLimit:Number(v.oversLimit)});save();closeModal();render()}
function deleteMatch(id){if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id);if(!m)return;if(!confirm(`Delete ${team(m.teamA).name} vs ${team(m.teamB).name}, including its scorecard? This cannot be undone unless you have a backup.`))return;db.matches=db.matches.filter(x=>x.id!==id);if(db.activeMatch===id)db.activeMatch=null;save();render()}
function quickStartMatch(){if(!requireAdmin())return;if(db.teams.length<2){alert('Add at least two teams first.');return}openModal('Start a match · Choose teams',`<form onsubmit="createQuickMatch(event)"><div class="form-grid"><div class="field"><label>Team A</label><select name="teamA">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Team B</label><select name="teamB">${db.teams.map((t,i)=>`<option value="${t.id}" ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Overs per innings</label><input type="number" name="oversLimit" min="1" max="50" value="8"></div></div><div class="field"><label>Venue</label><input name="venue" value="Jhabar Cricket Ground"></div><button class="btn primary">Continue to toss & team selection</button></form>`)}
function createQuickMatch(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.teamA===v.teamB){alert('Choose two different teams.');return}let m={id:'m'+Date.now(),teamA:v.teamA,teamB:v.teamB,date:v.date||new Date().toISOString().slice(0,10),venue:v.venue||'Jhabar Cricket Ground',status:'Upcoming',oversLimit:Number(v.oversLimit)||8,innings:[],result:'',practice:true};db.matches.unshift(m);save();closeModal();startMatch(m.id)}
function bulkPlayerUpload(){if(!requireAdmin())return;openModal('Bulk player photo upload',`<p class="muted">Select multiple player photos. After they load, enter each player's name, team and player type. Photos are resized before saving.</p><div class="field"><label>Select multiple photos</label><input id="bulkPhotos" type="file" accept="image/*" multiple onchange="prepareBulkPlayers(event)"></div><div id="bulkPlayerRows"></div>`)}
function prepareBulkPlayers(e){let files=[...(e.target.files||[])];if(!files.length)return;let host=document.getElementById('bulkPlayerRows');host.innerHTML='<div class="notice">Preparing selected photos…</div>';Promise.all(files.map(file=>new Promise(resolve=>{if(!file.type.startsWith('image/')||file.size>8*1024*1024){resolve(null);return}let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve({name:file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),photo:c.toDataURL('image/jpeg',.78)})};im.onerror=()=>resolve(null);im.src=r.result};r.onerror=()=>resolve(null);r.readAsDataURL(file)}))).then(items=>{let good=items.filter(Boolean);window._mslBulk=good;host.innerHTML=good.map((x,i)=>`<div class="card" style="margin:9px 0"><div class="upload-row"><img class="upload-preview" src="${x.photo}"><div style="flex:1"><div class="field"><label>Player name</label><input id="bulkName${i}" value="${esc(x.name)}" required></div><div class="form-grid"><div class="field"><label>Team</label><select id="bulkTeam${i}">${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Player type</label><select id="bulkType${i}"><option>Local</option><option>Open</option></select></div></div></div></div></div>`).join('')+`<button class="btn primary" onclick="saveBulkPlayers()">Save ${good.length} players</button>`;if(!good.length)host.innerHTML='<p class="muted">No valid photos selected. Use image files smaller than 8 MB.</p>'})}
function saveBulkPlayers(){if(!requireAdmin())return;let list=window._mslBulk||[];if(!list.length)return;let made=[];for(let i=0;i<list.length;i++){let name=document.getElementById('bulkName'+i)?.value.trim(),teamId=document.getElementById('bulkTeam'+i)?.value,playerType=document.getElementById('bulkType'+i)?.value;if(!name||!teamId){alert('Enter a name and team for every photo.');return}made.push({id:'p'+Date.now()+'_'+i,name,teamId,playerType,photo:list[i].photo,role:'Player',bat:'Right-hand',bowl:'—'})}db.players.push(...made);save();window._mslBulk=[];closeModal();render();alert(`${made.length} players added.`)}
function editPointsTable(){if(!requireAdmin())return;let rows=getStandings();openModal('Edit points table',`<p class="muted">Adjust played, wins, losses, no-results, points and NRR. Manual values override calculated standings until reset.</p>${rows.map((r,i)=>`<div class="card" style="margin:8px 0"><strong>${esc(r.team.name)}</strong><div class="form-grid"><div class="field"><label>Played</label><input type="number" id="ptp_${r.team.id}" value="${r.p}"></div><div class="field"><label>Won</label><input type="number" id="ptw_${r.team.id}" value="${r.w}"></div><div class="field"><label>Lost</label><input type="number" id="ptl_${r.team.id}" value="${r.l}"></div><div class="field"><label>No result</label><input type="number" id="ptnr_${r.team.id}" value="0"></div><div class="field"><label>Points</label><input type="number" id="ptpts_${r.team.id}" value="${r.pts}"></div><div class="field"><label>NRR</label><input type="number" step="0.001" id="ptnrr_${r.team.id}" value="${r.nrr}"></div></div></div>`).join('')}<button class="btn primary" onclick="savePointsTable()">Save table</button> <button class="btn" onclick="resetPointsTable()">Reset to match results</button>`)}
function savePointsTable(){if(!requireAdmin())return;db.manualStandings={};db.teams.forEach(t=>{let g=id=>Number(document.getElementById(id+'_'+t.id)?.value||0);db.manualStandings[t.id]={p:g('ptp'),w:g('ptw'),l:g('ptl'),nr:g('ptnr'),pts:g('ptpts'),nrr:g('ptnrr')}});save();closeModal();render()}
function resetPointsTable(){if(!requireAdmin())return;delete db.manualStandings;save();closeModal();render()}
function seasonForm(){if(!requireAdmin())return;openModal('Create new season',`<form onsubmit="saveSeason(event)"><div class="field"><label>Season number</label><input name="season" type="number" min="1" required value="${db.season+1}"></div><div class="field"><label>Year</label><input name="year" type="number" required value="${new Date().getFullYear()}"></div><div class="notice">Creating a new season archives the current season metadata. This prototype does not yet implement full historical database snapshots.</div><button class="btn primary">Create season</button></form>`)}
function saveSeason(e){e.preventDefault();let f=new FormData(e.target),s=Number(f.get('season')),y=Number(f.get('year'));if(s===db.season){alert('Choose a different season number.');return}db.archives.unshift({season:db.season,year:db.year,champion:'To be added'});db.season=s;db.year=y;db.matches=[];db.players=[];db.teams.forEach(t=>t.players=[]);save();closeModal();render()}
function chooseScoringMatch(){if(!requireAdmin())return;let choices=db.matches.filter(m=>m.status!=='Completed');if(!choices.length){alert('Create a match first.');return}openModal('Select match to score',`<div class="grid">${choices.map(m=>`<button class="btn" style="text-align:left" onclick="closeModal();startMatch('${m.id}')">${esc(team(m.teamA).name)} vs ${esc(team(m.teamB).name)} · ${m.status}</button>`).join('')}</div>`)}
function startMatch(id){if(!requireAdmin())return;let m=db.matches.find(x=>x.id===id);if(!m)return;if(!m.innings)m.innings=[];if(m.innings.length){m.status='Live';db.activeMatch=id;save();scorePage(id);return}let playersA=db.players.filter(p=>p.teamId===m.teamA),playersB=db.players.filter(p=>p.teamId===m.teamB);if(playersA.length<2||playersB.length<1){alert('Add at least two players to the batting team and one to the bowling team before starting.');return}openModal('Match setup · Toss & officials',`<form onsubmit="setupMatch(event,'${id}')"><div class="field"><label>Toss winner</label><select name="tossWinner"><option value="${m.teamA}">${esc(team(m.teamA).name)}</option><option value="${m.teamB}">${esc(team(m.teamB).name)}</option></select></div><div class="field"><label>Toss decision</label><select name="decision"><option value="bat">Elected to bat</option><option value="bowl">Elected to bowl</option></select></div><div class="field"><label>First innings batting team</label><select name="batting" id="setupBatting" onchange="refreshSetupPlayers('${id}')"><option value="${m.teamA}">${esc(team(m.teamA).name)}</option><option value="${m.teamB}">${esc(team(m.teamB).name)}</option></select></div><div class="field"><label>Opening striker</label><select name="striker" id="setupStriker" required>${[...playersA,...playersB].map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="field"><label>Opening non-striker</label><select name="nonStriker" id="setupNonStriker" required>${[...playersA,...playersB].map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="field"><label>Opening bowler</label><select name="bowler" id="setupBowler" required>${[...playersA,...playersB].map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(team(p.teamId).name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Umpire 1</label><input name="umpire1" placeholder="Umpire name"></div><div class="field"><label>Umpire 2</label><input name="umpire2" placeholder="Umpire name"></div></div><div class="field"><label>Scorer</label><input name="scorer" placeholder="Scorer name"></div><button class="btn primary">Confirm toss & start innings</button></form>`)}
function refreshSetupPlayers(id){let m=db.matches.find(x=>x.id===id),bat=document.getElementById('setupBatting')?.value;if(!m||!bat)return;let bowl=bat===m.teamA?m.teamB:m.teamA;let batters=db.players.filter(p=>p.teamId===bat),bowlers=db.players.filter(p=>p.teamId===bowl);['setupStriker','setupNonStriker'].forEach(k=>{let el=document.getElementById(k),old=el.value;el.innerHTML=batters.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(batters.some(p=>p.id===old))el.value=old});let be=document.getElementById('setupBowler'),old=be.value;be.innerHTML=bowlers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(bowlers.some(p=>p.id===old))be.value=old}
function setupMatch(e,id){e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),m=db.matches.find(x=>x.id===id);let batting=v.batting,bowling=batting===m.teamA?m.teamB:m.teamA;let validBat=db.players.filter(p=>p.teamId===batting).map(p=>p.id);let validBowl=db.players.filter(p=>p.teamId===bowling).map(p=>p.id);if(!validBat.includes(v.striker)||!validBat.includes(v.nonStriker)||v.striker===v.nonStriker||!validBowl.includes(v.bowler)){alert('Choose two different batters from the batting team and a bowler from the opposing team.');return}m.tossWinner=v.tossWinner;m.tossDecision=v.decision;m.umpires=[v.umpire1,v.umpire2].filter(Boolean);m.scorer=v.scorer||'';m.innings=[newInnings(batting,bowling,v.striker,v.nonStriker,v.bowler)];m.status='Live';db.activeMatch=id;save();closeModal();scorePage(id)}
function newInnings(bat,bowl,striker,non,bowler){return {batting:bat,bowling:bowl,runs:0,wickets:0,legal:0,balls:[],striker:striker||'',nonStriker:non||'',bowler:bowler||'',batStats:{},bowlStats:{},extras:{wide:0,noBall:0,bye:0,legBye:0,penalty:0},fow:[],dismissals:[],overBowlers:[],pendingBowler:false}}
function scorePage(id){let m=db.matches.find(x=>x.id===id);if(!m)return;page='admin';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='admin'));let inn=m.innings[m.innings.length-1];let bat=team(inn.batting),bowl=team(inn.bowling);let over=Math.floor(inn.legal/6),ball=inn.legal%6;let sr=player(inn.striker),ns=player(inn.nonStriker),bw=player(inn.bowler);document.getElementById('main').innerHTML=`${head('Live scoring console',`${bat.name} batting · ${bowl.name} bowling`,btn('Back to admin',"go('admin')"))}<div class="admin-banner">● SCORER MODE · ${esc(m.venue)} · ${fmtDate(m.date)} · ${m.oversLimit} overs</div><div class="score-hero"><div class="eyebrow">${esc(bat.name)} BATTING</div><div class="score-big">${inn.runs}<small>/${inn.wickets}</small></div><div class="score-details"><span>${over}.${ball} overs</span><span>Bowler: ${esc(bw.name)}</span><span>Umpires: ${esc((m.umpires||[]).join(' / ')||'—')}</span><span>CRR ${inn.legal?(inn.runs/(inn.legal/6)).toFixed(2):'0.00'}</span><span>Limit ${m.oversLimit} ov</span></div></div><div class="grid score-layout" style="margin-top:15px"><div class="card"><div class="section-title" style="margin-top:0"><h2>Current batters</h2><span>ON STRIKE: ${esc(sr.name)}</span></div><p>🏏 <strong>${esc(sr.name)}</strong> <span class="muted">Striker</span></p><p>🏏 <strong>${esc(ns.name)}</strong> <span class="muted">Non-striker</span></p><div class="field"><label>Change striker</label><select id="newStriker">${db.players.filter(p=>p.teamId===inn.batting).map(p=>`<option value="${p.id}" ${p.id===inn.striker?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="changePlayer('${id}','striker')">Update striker</button><div class="field" style="margin-top:14px"><label>Current bowler</label><select id="newBowler">${db.players.filter(p=>p.teamId===inn.bowling).map(p=>`<option value="${p.id}" ${p.id===inn.bowler?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="changePlayer('${id}','bowler')">Update bowler</button></div><div class="card"><div class="section-title" style="margin-top:0"><h2>Current over</h2><span>${over}.${ball}</span></div><div class="ball-list">${inn.balls.slice((inn.balls.map(x=>x.legal).lastIndexOf(true,inn.balls.length-1)>=0?inn.balls.map(x=>x.legal).lastIndexOf(true,inn.balls.length-1)+1:0)).map(b=>`<span class="ball">${b.label}</span>`).join('')||'<span class="muted">No deliveries yet</span>'}</div><div class="section-title"><h2>Quick actions</h2></div><button class="btn" onclick="undoBall('${id}')">↶ Undo last ball</button> <button class="btn" onclick="endInnings('${id}')">End innings</button></div></div><div class="grid score-layout" style="margin-top:15px"><div class="card"><div class="section-title" style="margin-top:0"><h2>Record runs</h2><span>Tap delivery outcome</span></div><div class="score-controls"><button class="run-btn" onclick="recordBall('${id}',0)">0</button><button class="run-btn" onclick="recordBall('${id}',1)">1</button><button class="run-btn" onclick="recordBall('${id}',2)">2</button><button class="run-btn" onclick="recordBall('${id}',3)">3</button><button class="run-btn boundary" onclick="recordBall('${id}',4)">4</button><button class="run-btn six" onclick="recordBall('${id}',6)">6</button></div><div class="section-title"><h2>Extras</h2></div><div class="score-controls"><button class="run-btn" onclick="recordExtra('${id}','wide')">Wide</button><button class="run-btn" onclick="recordExtra('${id}','noBall')">No-ball</button><button class="run-btn" onclick="recordExtra('${id}','bye')">Bye</button><button class="run-btn" onclick="recordExtra('${id}','legBye')">Leg-bye</button></div><div class="section-title"><h2>Wicket</h2></div><div class="score-controls"><button class="run-btn wicket" onclick="recordWicket('${id}','Bowled')">Bowled</button><button class="run-btn wicket" onclick="recordWicket('${id}','Caught')">Caught</button><button class="run-btn wicket" onclick="recordWicket('${id}','LBW')">LBW</button><button class="run-btn wicket" onclick="recordWicket('${id}','Run out')">Run out</button><button class="run-btn wicket" onclick="recordWicket('${id}','Stumped')">Stumped</button><button class="run-btn wicket" onclick="recordWicket('${id}','Hit wicket')">Hit wicket</button></div></div><div class="card"><div class="section-title" style="margin-top:0"><h2>Innings summary</h2></div><p class="muted">Extras <strong style="float:right;color:white">${Object.values(inn.extras).reduce((a,b)=>a+b,0)}</strong></p><p class="muted">Legal balls <strong style="float:right;color:white">${inn.legal}</strong></p><p class="muted">Wickets <strong style="float:right;color:white">${inn.wickets}</strong></p><div class="section-title"><h2>Innings controls</h2></div>${btn('Finish innings',`endInnings('${id}')`,'primary')} ${btn('Complete match',`completeMatch('${id}')`,'danger')}<p class="muted" style="font-size:11px;margin-top:12px">Prototype scoring: use the buttons to record deliveries. Validate scorecards before official use.</p></div></div>`}
function getInn(id){let m=db.matches.find(x=>x.id===id);return [m,m.innings[m.innings.length-1]]}
function snapshot(inn){return JSON.parse(JSON.stringify(inn))}
function pushUndo(i){i.undoStack=i.undoStack||[];let c=snapshot(i);delete c.undoStack;i.undoStack.push(c);if(i.undoStack.length>100)i.undoStack.shift()}
function addBat(inn,id){if(!inn.batStats[id])inn.batStats[id]={runs:0,balls:0,fours:0,sixes:0};return inn.batStats[id]}
function addBowl(inn,id){if(!inn.bowlStats[id])inn.bowlStats[id]={runs:0,balls:0,wickets:0};return inn.bowlStats[id]}
function recordBall(id,r){if(!requireAdmin())return;let [m,i]=getInn(id);pushUndo(i);if(i.legal>=m.oversLimit*6){alert('Overs limit reached.');return}let b=addBat(i,i.striker),bw=addBowl(i,i.bowler);i.runs+=r;b.runs+=r;b.balls++;if(r===4)b.fours++;if(r===6)b.sixes++;bw.runs+=r;bw.balls++;i.legal++;i.balls.push({label:String(r),runs:r,legal:true,kind:'run',batter:i.striker,bowler:i.bowler});if(r%2)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];if(i.legal%6===0){[i.striker,i.nonStriker]=[i.nonStriker,i.striker];if(i.legal<m.oversLimit*6)i.pendingBowler=true}save();if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)}
function recordExtra(id,type){if(!requireAdmin())return;let [m,i]=getInn(id);pushUndo(i);if(i.legal>=m.oversLimit*6){alert('Overs limit reached.');return}let amount=1;i.runs+=amount;i.extras[type]=(i.extras[type]||0)+amount;let legal=type==='bye'||type==='legBye';let label=type==='wide'?'Wd':type==='noBall'?'Nb':type==='bye'?'B':'Lb';if(type==='wide'||type==='noBall')addBowl(i,i.bowler).runs+=amount;else addBowl(i,i.bowler).balls++;if(legal){if(amount%2)[i.striker,i.nonStriker]=[i.nonStriker,i.striker];i.legal++;if(i.legal%6===0){[i.striker,i.nonStriker]=[i.nonStriker,i.striker];if(i.legal<m.oversLimit*6)i.pendingBowler=true}}i.balls.push({label,runs:amount,legal,kind:type,batter:i.striker,bowler:i.bowler});save();if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)}
function recordWicket(id,kind){if(!requireAdmin())return;let [m,i]=getInn(id);pushUndo(i);if(i.legal>=m.oversLimit*6){alert('Overs limit reached.');return}let out=i.striker;let remaining=db.players.filter(p=>p.teamId===i.batting&&! [i.striker,i.nonStriker].includes(p.id)&&!i.dismissals.some(d=>d.player===p.id));let fielders=db.players.filter(p=>p.teamId===i.bowling);openModal('Wicket details',`<form onsubmit="confirmWicket(event,'${id}','${kind}','${out}')"><p><strong>${esc(player(out).name)}</strong> · ${esc(kind)}</p><div class="field"><label>Dismissed batter</label><select name="dismissed"><option value="${i.striker}">Striker: ${esc(player(i.striker).name)}</option><option value="${i.nonStriker}">Non-striker: ${esc(player(i.nonStriker).name)}</option></select></div>${kind==='Caught'?`<div class="field"><label>Caught by</label><select name="fielder">${fielders.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`:''}${kind==='Run out'?`<div class="field"><label>Run out by (fielder)</label><select name="fielder">${fielders.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Which end / batter dismissed?</label><select name="dismissed"><option value="${i.striker}">${esc(player(i.striker).name)} (striker)</option><option value="${i.nonStriker}">${esc(player(i.nonStriker).name)} (non-striker)</option></select></div><div class="field"><label>Completed runs before run out</label><select name="completedRuns"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>`:''}<div class="field"><label>Next batter</label><select name="nextBatter"><option value="">Select after wicket</option>${remaining.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary">Confirm wicket</button></form>`)}
function confirmWicket(e,id,kind,out){e.preventDefault();let [m,i]=getInn(id),v=Object.fromEntries(new FormData(e.target)),dismissed=v.dismissed||out,legal=true;let completed=Number(v.completedRuns||0);i.runs+=completed;i.wickets++;i.legal++;let bw=addBowl(i,i.bowler);bw.balls++;if(!['Run out'].includes(kind))bw.wickets++;i.fow.push({w:i.wickets,r:i.runs,over:`${Math.floor((i.legal-1)/6)}.${(i.legal-1)%6}`,player:dismissed});i.dismissals.push({player:dismissed,kind,fielder:v.fielder||'',bowler:i.bowler,over:i.legal});m.fielding=m.fielding||{};if(v.fielder){m.fielding[v.fielder]=m.fielding[v.fielder]||{catches:0,runOuts:0};if(kind==='Caught')m.fielding[v.fielder].catches++;if(kind==='Run out')m.fielding[v.fielder].runOuts++;}i.balls.push({label:'W',runs:completed,legal,kind:'wicket',dismissal:kind,player:dismissed,fielder:v.fielder||'',bowler:i.bowler});let next=v.nextBatter,end=dismissed===i.striker?'striker':'nonStriker';i[end]=next||'';i.pendingWicketEnd=end;if(i.legal%6===0){[i.striker,i.nonStriker]=[i.nonStriker,i.striker];if(i.legal<m.oversLimit*6)i.pendingBowler=true}save();closeModal();if(i.wickets>=10||i.legal>=m.oversLimit*6){scorePage(id);return}if(!next){openModal('Select next batter',`<p>Choose the incoming batter to continue.</p><div class="field"><select id="nextBatter">${db.players.filter(p=>p.teamId===i.batting&&!i.dismissals.some(d=>d.player===p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="setNextBatter('${id}','${dismissed}')">Continue</button>`);return}if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)}
function setNextBatter(id,dismissed){let [m,i]=getInn(id),v=document.getElementById('nextBatter').value;if(!v)return;i[i.pendingWicketEnd||'striker']=v;delete i.pendingWicketEnd;closeModal();save();if(i.pendingBowler)chooseNextBowler(id);else scorePage(id)}
function chooseNextBowler(id){let [m,i]=getInn(id);let eligible=db.players.filter(p=>p.teamId===i.bowling&&p.id!==i.bowler);openModal('Over complete · Select next bowler',`<p>Six legal balls completed. Select the bowler for over ${Math.floor(i.legal/6)+1}.</p><div class="field"><label>Next over bowler</label><select id="nextBowler">${eligible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="setNextBowler('${id}')">Start next over</button>`)}
function setNextBowler(id){let [m,i]=getInn(id),v=document.getElementById('nextBowler').value;if(!v){alert('Select a bowler.');return}i.bowler=v;i.pendingBowler=false;i.overBowlers.push(v);closeModal();save();scorePage(id)}
function confirmNextBatter(id){let [m,i]=getInn(id);i.striker=document.getElementById('nextBatter').value;closeModal();save();scorePage(id)}
function changePlayer(id,which){let [m,i]=getInn(id);let v=document.getElementById(which==='striker'?'newStriker':'newBowler').value;if(which==='striker')i.striker=v;else i.bowler=v;save();scorePage(id)}
function undoBall(id){if(!requireAdmin())return;let [m,i]=getInn(id);if(!i.balls.length||!i.undoStack?.length){alert('Nothing to undo.');return}let history=i.undoStack;let prev=history.pop();Object.keys(i).forEach(k=>delete i[k]);Object.assign(i,prev);i.undoStack=history;save();scorePage(id)}
function endInnings(id){let [m,i]=getInn(id);if(m.innings.length>=2){alert('Both innings have been recorded. Complete the match.');return}let batting=i.bowling,bowling=i.batting;let eligible=db.players.filter(p=>p.teamId===batting);let other=db.players.filter(p=>p.teamId===bowling);openModal('Start second innings',`<form onsubmit="secondInnings(event,'${id}','${batting}','${bowling}')"><div class="field"><label>Opening striker</label><select name="striker">${eligible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Non-striker</label><select name="nonStriker">${eligible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Opening bowler</label><select name="bowler">${other.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary">Start second innings</button></form>`)}
function secondInnings(e,id,bat,bowl){e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),m=db.matches.find(x=>x.id===id);m.innings.push(newInnings(bat,bowl,v.striker,v.nonStriker,v.bowler));save();closeModal();scorePage(id)}
function completeMatch(id){let m=db.matches.find(x=>x.id===id);if(m.innings.length<2){alert('Complete both innings first.');return}let [a,b]=m.innings;let winner=a.runs>b.runs?a.batting:b.runs>a.runs?b.batting:null;m.winner=winner;m.result=winner?`${team(winner).name} won`:'Match tied';m.status='Completed';save();openModal('Match completed',`<h2>${esc(m.result)}</h2><p>${esc(team(a.batting).name)} ${a.runs}/${a.wickets} · ${esc(team(b.batting).name)} ${b.runs}/${b.wickets}</p><button class="btn primary" onclick="closeModal();go('matches')">View matches</button>`)}
function openMatch(id){let m=db.matches.find(x=>x.id===id);if(!m)return;if(m.status==='Live'&&db.admin){scorePage(id);return}let inn=m.innings||[];openModal('Match centre',`<div>${esc(team(m.teamA).name)} <strong>vs</strong> ${esc(team(m.teamB).name)}</div><p class="muted">${fmtDate(m.date)} · ${esc(m.venue)} · Umpires: ${esc((m.umpires||[]).join(' / ')||'—')} · Scorer: ${esc(m.scorer||'—')}</p>${inn.map((i,n)=>`<div class="card" style="margin:10px 0"><strong>${esc(team(i.batting).name)}</strong><h2>${i.runs}/${i.wickets} <small class="muted">${Math.floor(i.legal/6)}.${i.legal%6} overs</small></h2><p class="muted">Extras: ${Object.values(i.extras).reduce((a,b)=>a+b,0)} · ${Math.floor(i.legal/6)}.${i.legal%6} overs</p><div class="table-wrap"><table><thead><tr><th>Batter</th><th>Dismissal</th><th>Runs</th><th>Balls</th><th>4s</th><th>6s</th></tr></thead><tbody>${Object.entries(i.batStats).map(([pid,s])=>{let d=(i.dismissals||[]).find(x=>x.player===pid);return `<tr><td>${esc(player(pid).name)}</td><td>${d?esc(d.kind)+(d.fielder?' · '+esc(player(d.fielder).name):''):'Not out'}</td><td>${s.runs}</td><td>${s.balls}</td><td>${s.fours}</td><td>${s.sixes}</td></tr>`}).join('')}</tbody></table></div><h4>Bowling</h4><div class="table-wrap"><table><thead><tr><th>Bowler</th><th>Legal balls</th><th>Runs</th><th>Wickets</th></tr></thead><tbody>${Object.entries(i.bowlStats||{}).map(([pid,s])=>`<tr><td>${esc(player(pid).name)}</td><td>${s.balls}</td><td>${s.runs}</td><td>${s.wickets}</td></tr>`).join('')}</tbody></table></div><p class="muted">Fall of wickets: ${(i.fow||[]).map(x=>`${x.r}/${x.w} (${esc(player(x.player).name)}, ${x.over})`).join(' · ')||'—'}</p></div>`).join('')||'<p class="muted">Match has not started yet.</p>'}<p><strong>${esc(m.result||m.status)}</strong></p>`)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='msl-backup-season-'+db.season+'.json';a.click();URL.revokeObjectURL(url)}
function importData(e){if(!requireAdmin())return;let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||!Array.isArray(v.teams)||!Array.isArray(v.matches)||!Array.isArray(v.players))throw Error('Missing teams, matches or players arrays.');if(v.teams.some(x=>!x||!x.id||!x.name)||v.players.some(x=>!x||!x.id||!x.name||!x.teamId)||v.matches.some(x=>!x||!x.id||!x.teamA||!x.teamB))throw Error('One or more records are missing required fields.');if(!confirm(`Backup preview\n\nSeason: ${v.season??'Not specified'}\nTeams: ${v.teams.length}\nPlayers: ${v.players.length}\nMatches: ${v.matches.length}\n\nThis will replace the current MSL data on all connected devices. Your current data will be downloaded as a backup first. Continue?`))return;exportData();db={...structuredClone(seed),...v,admin:true,teams:v.teams,players:v.players,matches:v.matches,archives:Array.isArray(v.archives)?v.archives:[],manualStandings:v.manualStandings||{}};save();render();alert('Backup imported. Keep the downloaded safety backup until you verify the website data.')}catch(err){alert('Import stopped: '+(err.message||'Invalid MSL backup file.'))}finally{e.target.value=''}};r.readAsText(file)}
render();
</script>
